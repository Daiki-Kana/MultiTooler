<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Slide Controller</title>
  <link rel="stylesheet" href="style.css">
  <script src="qrcode.min.js"></script>
  <script src="jsqr.min.js"></script>
  <script src="peerjs.min.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.012em;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* スリープ防止ビデオを画面外に完全に除外し、レイアウト押し下げを防止 */
    #fallbackVideo {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -100;
    }

    .view-container {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    .view-container.active {
      display: flex;
    }

    /* --------------------------------------------------------------------------
       Host View (PC Presentation & Big QR Receiver, Borderless)
       -------------------------------------------------------------------------- */
    #viewHost {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      background: var(--color-canvas);
      overflow: hidden;
      box-sizing: border-box;
    }

    #viewHost.active {
      display: flex;
    }

    .host-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    .host-card {
      background: var(--color-surface-1);
      border-radius: 28px;
      padding: 36px 40px;
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    .host-qr-img {
      width: 260px;
      height: 260px;
      background: #ffffff;
      padding: 12px;
      border-radius: 20px;
      display: block;
      object-fit: contain;
    }

    .host-room-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--color-surface-2);
      padding: 8px 18px;
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      color: var(--color-ink);
      letter-spacing: 1px;
    }

    .host-connected-panel {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 28px;
    }

    .host-connected-panel.active {
      display: flex;
    }

    .host-slide-number {
      font-size: clamp(80px, 18vw, 160px);
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      letter-spacing: -3px;
    }

    .host-timer-big {
      font-size: clamp(36px, 8vw, 68px);
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--color-ink-muted);
      letter-spacing: -1px;
    }

    .host-actions-hint {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    /* レーザーポインター / バーチャルカーソル (完全ボーダーレス・高視認性) */
    #laserPointer {
      display: none;
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 30, 30, 0.95) 0%, rgba(255, 30, 30, 0.3) 60%, transparent 100%);
      box-shadow: 0 0 16px rgba(255, 30, 30, 0.8);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.08s ease, height 0.08s ease;
    }

    #laserPointer.active {
      display: block;
    }

    #laserPointer.clicking {
      width: 34px;
      height: 34px;
      box-shadow: 0 0 24px rgba(255, 30, 30, 1);
    }

    /* --------------------------------------------------------------------------
       Top Bar (Icon Buttons, Zero Borders)
       -------------------------------------------------------------------------- */
    .bar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Circular / Square Borderless Icon Buttons */
    .btn-icon {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 50%;
      transition: background-color 0.12s ease, transform 0.08s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: var(--color-surface-1);
    }

    .btn-icon:active {
      background: var(--color-surface-2);
      transform: scale(0.92);
    }

    .slide-badge {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 14px;
      color: var(--color-ink-muted);
      letter-spacing: -0.5px;
      padding: 0 4px;
    }

    /* --------------------------------------------------------------------------
       Menu View (2x2 Grid, Full Height & Width, Borderless)
       -------------------------------------------------------------------------- */
    .menu-body {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      padding: 12px 16px max(20px, env(safe-area-inset-bottom, 20px)) 16px;
      gap: 12px;
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }

    .menu-card {
      width: 100%;
      height: 100%;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background-color 0.15s ease, transform 0.08s ease;
      font-family: var(--font-family);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .menu-card:hover {
      background: var(--color-surface-2);
    }

    .menu-card:active {
      transform: scale(0.98);
      background: #d4d4d4;
    }

    .menu-card.primary {
      background: var(--color-ink);
      color: #ffffff;
    }

    .menu-card.primary:hover {
      background: #2a2a2a;
    }

    .menu-card.primary:active {
      background: #000000;
    }

    /* --------------------------------------------------------------------------
       Remote View (Icon Centric, Borderless)
       -------------------------------------------------------------------------- */
    .button-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 10px max(16px, env(safe-area-inset-bottom, 16px)) 10px;
      min-height: 0;
      box-sizing: border-box;
    }

    /* 上段: PREV (前のスライドへ戻る) */
    .btn-remote-prev {
      flex: 4;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .btn-remote-prev:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-prev:active, .btn-remote-prev.pressed {
      background-color: #d8d8d8;
      transform: scale(0.98);
    }

    /* 中段: 細めのタイマー停止・再開ボタン (誤タップ防止でスリムに配置) */
    .btn-remote-timer {
      flex: 2;
      min-height: 56px;
      max-height: 68px;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-remote-timer:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-timer:active, .btn-remote-timer.pressed {
      transform: scale(0.97);
    }

    /* タイマー進行中 */
    .btn-remote-timer.timer-running {
      background-color: var(--color-surface-2);
      color: var(--color-ink);
    }

    /* タイマー停止中 */
    .btn-remote-timer.timer-paused {
      background-color: var(--color-surface-1);
      color: var(--color-ink-muted);
    }

    .timer-display-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .timer-text {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .timer-state-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-surface-1);
      color: var(--color-ink);
      transition: all 0.12s ease;
    }

    .timer-running .timer-state-icon {
      background: var(--color-ink);
      color: #ffffff;
    }

    .timer-paused .icon-play { display: block; margin-left: 2px; }
    .timer-paused .icon-pause { display: none; }
    .timer-running .icon-play { display: none; }
    .timer-running .icon-pause { display: block; }

    /* 下段: 今まで通りのNEXTボタン (スライド送りのメイン領域) */
    .btn-remote-next {
      flex: 6;
      background-color: var(--color-ink);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 16px;
      touch-action: manipulation;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .btn-remote-next:hover {
      background-color: #2a2a2a;
    }

    .btn-remote-next:active, .btn-remote-next.pressed {
      background-color: #000000;
      transform: scale(0.98);
    }

    /* --------------------------------------------------------------------------
       Modal (Icon Focused, Soft Elevation, No Box Borders)
       -------------------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-panel {
      background: var(--color-canvas);
      border: none;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tab-bar {
      display: flex;
      background: var(--color-surface-1);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .tab-item {
      flex: 1;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.12s ease;
    }

    .tab-item.active {
      background: #ffffff;
      color: var(--color-ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0 12px;
    }

    .qr-img {
      display: block;
      width: 200px;
      height: 200px;
      background: #ffffff;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .url-row {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--color-surface-1);
      border-radius: 8px;
      padding: 4px 4px 4px 12px;
    }

    .url-text {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }



    /* Server Host Config Row (Borderless, Minimal) */
    .server-config-box {
      width: 100%;
      margin-top: 14px;
      padding-top: 14px;
      border-top: none;
    }

    .server-config-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: var(--color-surface-1);
      border-radius: 12px;
      padding: 4px 6px 4px 12px;
      box-sizing: border-box;
    }

    .server-url-input {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-ink);
      box-sizing: border-box;
    }

    .server-save-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--color-ink);
      color: #ffffff;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s ease, transform 0.08s ease;
    }

    .server-save-btn:active {
      transform: scale(0.92);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Unconnected Guidance Banner (Borderless, Minimal) */
    .unconnected-notice {
      margin: 12px 16px 0 16px;
      padding: 10px 14px;
      background: var(--color-surface-1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    .unconnected-content {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--color-ink);
      font-size: 13px;
      font-weight: 600;
    }

    .unconnected-scan-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-ink);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.08s ease, opacity 0.1s ease;
    }

    .unconnected-scan-btn:active {
      transform: scale(0.94);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Camera Scanner Viewport */
    .scanner-viewport {
      position: relative;
      width: 100%;
      height: 280px;
      background: #111111;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scanVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-reticle {
      position: absolute;
      width: 180px;
      height: 180px;
      pointer-events: none;
    }

    .scanner-reticle .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #ffffff;
      border-style: solid;
      border-width: 0;
    }

    .scanner-reticle .corner.tl {
      top: 0; left: 0;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 6px;
    }

    .scanner-reticle .corner.tr {
      top: 0; right: 0;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 6px;
    }

    .scanner-reticle .corner.bl {
      bottom: 0; left: 0;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 6px;
    }

    .scanner-reticle .corner.br {
      bottom: 0; right: 0;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 6px;
    }

    /* Settings in Modal */
    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .time-input {
      flex: 1;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 500;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      outline: none;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      padding: 12px 4px;
      cursor: pointer;
      text-align: center;
      border-radius: 8px;
      transition: background-color 0.1s ease;
    }

    .preset-btn:hover {
      background: var(--color-surface-2);
    }

    .preset-btn.selected {
      background: var(--color-ink);
      color: #ffffff;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-size: 13px;
      color: var(--color-ink);
      margin-bottom: 20px;
      border-top: 1px solid var(--color-surface-1);
      border-bottom: 1px solid var(--color-surface-1);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flash-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: rgba(15, 98, 254, 0);
      transition: background 0.08s ease-out;
      z-index: 200;
    }

    .flash-overlay.active {
      background: rgba(15, 98, 254, 0.08);
    }

    /* --------------------------------------------------------------------------
       Joystick View (Portrait, Borderless, Joycon-Style)
       -------------------------------------------------------------------------- */
    #viewTrackpad {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      background: var(--color-canvas);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewTrackpad.active {
      display: flex;
    }

    .stick-main-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px max(16px, env(safe-area-inset-bottom, 16px)) 16px;
      box-sizing: border-box;
      touch-action: none;
      overflow: hidden;
    }

    /* 上部アクション行 */
    .stick-action-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stick-action-btn {
      flex: 1;
      height: 52px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .stick-action-btn:hover {
      background: var(--color-surface-2);
    }

    .stick-action-btn:active, .stick-action-btn.active {
      background: var(--color-ink);
      color: #ffffff;
      transform: scale(0.94);
    }

    /* キーボード入力トレイ (1行ミニマル・ボーダーレス・アイコンファースト) */
    .keyboard-tray {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .keyboard-tray.active {
      display: flex;
    }

    .keyboard-input-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-input {
      flex: 1;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 0 14px;
      font-family: var(--font-family);
      font-size: 15px;
      color: var(--color-ink);
      box-sizing: border-box;
      transition: background-color 0.12s ease;
    }

    .phone-input:focus {
      background: var(--color-surface-2);
    }

    .key-sub-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-surface-1);
      color: var(--color-ink);
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-sub-btn:hover {
      background: var(--color-surface-2);
    }

    .key-sub-btn:active {
      transform: scale(0.92);
      background: #d4d4d4;
    }

    .key-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-ink);
      color: #ffffff;
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-send-btn:hover {
      background: #2a2a2a;
    }

    .key-send-btn:active {
      transform: scale(0.92);
      background: #000000;
    }

    /* トラックパッド領域 (広大・高精度・ボーダーレス) */
    .trackpad-wrapper {
      flex: 1;
      width: 100%;
      max-width: 360px;
      margin: 8px 0;
      min-height: 120px;
      display: flex;
      align-items: stretch;
      touch-action: none;
    }

    .trackpad-surface {
      flex: 1;
      width: 100%;
      background: var(--color-surface-1);
      border: none;
      border-radius: 20px;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      cursor: default;
    }

    .trackpad-surface:active, .trackpad-surface.touching {
      background: var(--color-surface-2);
    }

    /* 下部コントロール群 (ドラッグ長押しバー ＋ コピー/ペースト) */
    .stick-bottom-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .stick-drag-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* 長押しバー (丸アイコン全廃・ボーダーレス・ミニマルバー) */
    .stick-drag-btn {
      width: 100%;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      position: relative;
      transition: background-color 0.12s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    /* バー中央のミニマルなインジケーター線 */
    .stick-drag-btn::after {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-ink);
      opacity: 0.25;
      transition: all 0.12s ease;
    }

    .stick-drag-btn:hover {
      background: var(--color-surface-2);
    }

    /* 長押し押下中の状態 (ネオンレッド反転・高コントラスト) */
    .stick-drag-btn.holding {
      background: #ff003b;
      transform: scale(0.98);
    }

    .stick-drag-btn.holding::after {
      background: #ffffff;
      opacity: 0.9;
      width: 48px;
    }
  </style>
</head>
