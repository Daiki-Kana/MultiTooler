<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ToolBox</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ToolBox">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <script src="qrcode.min.js"></script>
  <script src="jsqr.min.js"></script>
  <script src="peerjs.min.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.012em;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* スリープ防止ビデオを画面外に完全に除外し、レイアウト押し下げを防止 */
    #fallbackVideo {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -100;
    }

    .view-container {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    .view-container.active {
      display: flex;
    }

    /* --------------------------------------------------------------------------
       Top Bar (Icon Buttons, Zero Borders, Safe Area Compliant)
       -------------------------------------------------------------------------- */
    .bar {
      height: calc(52px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: 0;
      padding-left: max(16px, env(safe-area-inset-left, 16px));
      padding-right: max(16px, env(safe-area-inset-right, 16px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Circular / Square Borderless Icon Buttons */
    .btn-icon {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 50%;
      transition: background-color 0.12s ease, transform 0.08s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: var(--color-surface-1);
    }

    .btn-icon:active {
      background: var(--color-surface-2);
      transform: scale(0.92);
    }

    .slide-badge {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 14px;
      color: var(--color-ink-muted);
      letter-spacing: -0.5px;
      padding: 0 4px;
    }

    /* --------------------------------------------------------------------------
       Connection Pill & Dynamic Toast (Icon First, Zero Borders, Aesthetic)
       -------------------------------------------------------------------------- */
    .connection-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 9999px;
      background: var(--color-surface-1);
      color: var(--color-ink-muted);
      cursor: default;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-user-select: none;
      border: none;
    }

    .connection-pill .route-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .connection-pill .status-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      width: 0;
      overflow: hidden;
    }

    .connection-pill.connected {
      background: var(--color-surface-2);
      color: var(--color-ink);
    }

    .connection-pill.connected .status-check {
      opacity: 1;
      transform: scale(1);
      width: 13px;
    }

    .connection-pill.disconnected {
      opacity: 0.55;
      color: var(--color-ink-subtle);
    }

    .connection-pill.disconnected .route-icon {
      position: relative;
    }

    .connection-pill.disconnected .route-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 17px;
      height: 2px;
      background: currentColor;
      transform: translate(-50%, -50%) rotate(-45deg);
      border-radius: 2px;
      box-shadow: 0 0 0 1px var(--color-surface-1);
    }

    .connection-pill[data-route="wifi"] .route-cloud { display: none; }
    .connection-pill[data-route="wifi"] .route-wifi { display: inline-flex; }
    .connection-pill[data-route="cloud"] .route-wifi { display: none; }
    .connection-pill[data-route="cloud"] .route-cloud { display: inline-flex; }

    /* --------------------------------------------------------------------------
       Connection Blocker & Dynamic Toast (Icon First, Zero Borders, Aesthetic)
       -------------------------------------------------------------------------- */
    .conn-blocker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 999999;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: all;
      color: #111113;
    }

    .conn-blocker.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .blocker-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 360px;
      min-height: 180px;
      padding: 24px;
      box-sizing: border-box;
    }

    /* 1. 未接続時: 中央スピナー（クルクル）＆スキャン起動 */
    .blocker-waiting {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: all;
    }

    .conn-blocker.state-connected .blocker-waiting {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
    }

    .spinner-svg {
      animation: spinSpinner 1.1s linear infinite;
    }

    @keyframes spinSpinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .blocker-scan-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.06);
      color: #111113;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
      padding: 0;
    }

    .blocker-scan-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .blocker-scan-btn:active {
      transform: scale(0.92);
      background: rgba(0, 0, 0, 0.16);
    }

    /* 2. 接続完了時: 2.5秒ワイヤーアニメーション ＆ 中央チェックマーク */
    .blocker-connected {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 100%;
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .conn-blocker.state-connected .blocker-connected {
      opacity: 1;
      transform: scale(1);
      pointer-events: all;
    }

    .toast-anim-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .toast-node {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.06);
      color: #111113;
      transition: transform 0.3s ease;
    }

    .toast-wire-area {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 48px;
      width: 48px;
    }

    .wire-direct {
      display: flex;
      align-items: center;
      width: 100%;
    }

    /* ワイヤー線アニメーション (PCからスマホへ一本のラインがスッと淀みなく伸びる) */
    .wire-line {
      stroke: #111113;
      stroke-width: 2.8;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      will-change: stroke-dashoffset;
      transition: stroke-dashoffset 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .conn-blocker.state-connected .wire-line {
      stroke-dashoffset: 0;
    }

    /* 中央チェックマーク (白黒モノトーン・純白背景に映える黒丸・白チェック) */
    .toast-center-check {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #111113;
      color: #ffffff;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1) 0.8s, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
    }

    .conn-blocker.state-connected .toast-center-check {
      opacity: 1;
      transform: scale(1);
    }

    @keyframes fadeInBlocker {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    /* --------------------------------------------------------------------------
       Menu View (Separated Connect Area & Tools Grid, Borderless, Icon First)
       -------------------------------------------------------------------------- */
    .menu-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 16px 14px max(24px, env(safe-area-inset-bottom, 24px)) 14px;
      width: 100%;
      box-sizing: border-box;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    /* 1. 最上部: 接続アクションエリア (QR表示 & スキャンカメラ) */
    .menu-connect-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .connect-card {
      width: 100%;
      height: 76px;
      border: none;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      cursor: pointer;
      box-sizing: border-box;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .connect-card svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    /* QRコード表示 (ソリッドブラック背景・純白アイコン・最重要カード) */
    .connect-card.primary {
      background: #111113;
      color: #ffffff;
    }

    .connect-card.primary svg {
      stroke: #ffffff;
    }

    .connect-card.primary:hover {
      background: #27272a;
    }

    .connect-card.primary:active {
      transform: scale(0.95);
      background: #3f3f46;
    }

    /* スキャン用カメラ (淡グレー背景・ソリッドブラックアイコン) */
    .connect-card.secondary {
      background: var(--color-surface-1);
      color: var(--color-ink);
    }

    .connect-card.secondary svg {
      stroke: var(--color-ink);
    }

    .connect-card.secondary:hover {
      background: var(--color-surface-2);
    }

    .connect-card.secondary:active {
      transform: scale(0.95);
      background: #e5e5ea;
    }

    /* 2. 下部: アプリ・ツールグリッド (3列正方形スクロール) */
    .menu-tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 104px;
      gap: 12px;
      width: 100%;
      align-content: start;
    }

    .menu-card {
      width: 100%;
      height: 104px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.1s ease;
      font-family: var(--font-family);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-sizing: border-box;
      padding: 10px 6px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .menu-card svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .menu-card:hover {
      background: var(--color-surface-2);
    }

    .menu-card:active {
      transform: scale(0.94);
      background: #e5e5ea;
    }

    /* --------------------------------------------------------------------------
       Remote View (Icon Centric, Borderless)
       -------------------------------------------------------------------------- */
    .button-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 10px max(16px, env(safe-area-inset-bottom, 16px)) 10px;
      min-height: 0;
      box-sizing: border-box;
    }

    /* 上段: PREV (前のスライドへ戻る) */
    .btn-remote-prev {
      flex: 4;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .btn-remote-prev:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-prev:active, .btn-remote-prev.pressed {
      background-color: #d8d8d8;
      transform: scale(0.98);
    }

    /* 中段: 細めのタイマー停止・再開ボタン (誤タップ防止でスリムに配置) */
    .btn-remote-timer {
      flex: 2;
      min-height: 56px;
      max-height: 68px;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-remote-timer:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-timer:active, .btn-remote-timer.pressed {
      transform: scale(0.97);
    }

    /* タイマー進行中 */
    .btn-remote-timer.timer-running {
      background-color: var(--color-surface-2);
      color: var(--color-ink);
    }

    /* タイマー停止中 */
    .btn-remote-timer.timer-paused {
      background-color: var(--color-surface-1);
      color: var(--color-ink-muted);
    }

    .timer-display-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .timer-text {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .timer-state-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-surface-1);
      color: var(--color-ink);
      transition: all 0.12s ease;
    }

    .timer-running .timer-state-icon {
      background: var(--color-ink);
      color: #ffffff;
    }

    .timer-paused .icon-play { display: block; margin-left: 2px; }
    .timer-paused .icon-pause { display: none; }
    .timer-running .icon-play { display: none; }
    .timer-running .icon-pause { display: block; }

    /* 下段: 今まで通りのNEXTボタン (スライド送りのメイン領域) */
    .btn-remote-next {
      flex: 6;
      background-color: var(--color-ink);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 16px;
      touch-action: manipulation;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .btn-remote-next:hover {
      background-color: #2a2a2a;
    }

    .btn-remote-next:active, .btn-remote-next.pressed {
      background-color: #000000;
      transform: scale(0.98);
    }

    /* --------------------------------------------------------------------------
       Modal (Icon Focused, Soft Elevation, No Box Borders)
       -------------------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000000;
      padding: max(16px, env(safe-area-inset-top, 16px)) max(16px, env(safe-area-inset-right, 16px)) max(16px, env(safe-area-inset-bottom, 16px)) max(16px, env(safe-area-inset-left, 16px));
      box-sizing: border-box;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-panel {
      background: var(--color-canvas);
      border: none;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tab-bar {
      display: flex;
      background: var(--color-surface-1);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .tab-item {
      flex: 1;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.12s ease;
    }

    .tab-item.active {
      background: #ffffff;
      color: var(--color-ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0 12px;
    }

    .qr-img {
      display: block;
      width: 200px;
      height: 200px;
      background: #ffffff;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .url-row {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--color-surface-1);
      border-radius: 8px;
      padding: 4px 4px 4px 12px;
    }

    .url-text {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }



    /* Server Host Config Row (Borderless, Minimal) */
    .server-config-box {
      width: 100%;
      margin-top: 14px;
      padding-top: 14px;
      border-top: none;
    }

    .server-config-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      background: var(--color-surface-1);
      border-radius: 12px;
      padding: 4px 6px 4px 12px;
      box-sizing: border-box;
    }

    .server-url-input {
      flex: 1;
      height: 38px;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-ink);
      box-sizing: border-box;
    }

    .server-save-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--color-ink);
      color: #ffffff;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s ease, transform 0.08s ease;
    }

    .server-save-btn:active {
      transform: scale(0.92);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Unconnected Guidance Banner (Borderless, Minimal) */
    .unconnected-notice {
      margin: 12px 16px 0 16px;
      padding: 10px 14px;
      background: var(--color-surface-1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      animation: fadeIn 0.2s ease;
    }

    .unconnected-content {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--color-ink);
      font-size: 13px;
      font-weight: 600;
    }

    .unconnected-scan-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--color-ink);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-family: var(--font-family);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.08s ease, opacity 0.1s ease;
    }

    .unconnected-scan-btn:active {
      transform: scale(0.94);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Camera Scanner Viewport */
    .scanner-viewport {
      position: relative;
      width: 100%;
      height: 280px;
      background: #111111;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scanVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-reticle {
      position: absolute;
      width: 180px;
      height: 180px;
      pointer-events: none;
    }

    .scanner-reticle .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #ffffff;
      border-style: solid;
      border-width: 0;
    }

    .scanner-reticle .corner.tl {
      top: 0; left: 0;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 6px;
    }

    .scanner-reticle .corner.tr {
      top: 0; right: 0;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 6px;
    }

    .scanner-reticle .corner.bl {
      bottom: 0; left: 0;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 6px;
    }

    .scanner-reticle .corner.br {
      bottom: 0; right: 0;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 6px;
    }

    /* Settings in Modal */
    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .time-input {
      flex: 1;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 500;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      outline: none;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      padding: 12px 4px;
      cursor: pointer;
      text-align: center;
      border-radius: 8px;
      transition: background-color 0.1s ease;
    }

    .preset-btn:hover {
      background: var(--color-surface-2);
    }

    .preset-btn.selected {
      background: var(--color-ink);
      color: #ffffff;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-size: 13px;
      color: var(--color-ink);
      margin-bottom: 20px;
      border-top: 1px solid var(--color-surface-1);
      border-bottom: 1px solid var(--color-surface-1);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flash-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: rgba(15, 98, 254, 0);
      transition: background 0.08s ease-out;
      z-index: 200;
    }

    .flash-overlay.active {
      background: rgba(15, 98, 254, 0.08);
    }

    /* --------------------------------------------------------------------------
       Joystick View (Portrait, Borderless, Joycon-Style)
       -------------------------------------------------------------------------- */
    #viewTrackpad {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      background: var(--color-canvas);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewTrackpad.active {
      display: flex;
    }

    .stick-main-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px max(16px, env(safe-area-inset-bottom, 16px)) 16px;
      box-sizing: border-box;
      touch-action: none;
      overflow: hidden;
    }

    /* 上部アクション行 */
    .stick-action-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stick-action-btn {
      flex: 1;
      height: 52px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .stick-action-btn:hover {
      background: var(--color-surface-2);
    }

    .stick-action-btn:active, .stick-action-btn.active {
      background: var(--color-ink);
      color: #ffffff;
      transform: scale(0.94);
    }

    /* キーボード入力トレイ (1行ミニマル・ボーダーレス・アイコンファースト) */
    .keyboard-tray {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .keyboard-tray.active {
      display: flex;
    }

    .keyboard-input-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-input {
      flex: 1;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 0 14px;
      font-family: var(--font-family);
      font-size: 15px;
      color: var(--color-ink);
      box-sizing: border-box;
      transition: background-color 0.12s ease;
    }

    .phone-input:focus {
      background: var(--color-surface-2);
    }

    .key-sub-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-surface-1);
      color: var(--color-ink);
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-sub-btn:hover {
      background: var(--color-surface-2);
    }

    .key-sub-btn:active {
      transform: scale(0.92);
      background: #d4d4d4;
    }

    .key-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-ink);
      color: #ffffff;
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-send-btn:hover {
      background: #2a2a2a;
    }

    .key-send-btn:active {
      transform: scale(0.92);
      background: #000000;
    }

    /* トラックパッド領域 (広大・高精度・ボーダーレス) */
    .trackpad-wrapper {
      flex: 1;
      width: 100%;
      max-width: 360px;
      margin: 8px 0;
      min-height: 120px;
      display: flex;
      align-items: stretch;
      touch-action: none;
    }

    .trackpad-surface {
      flex: 1;
      width: 100%;
      background: var(--color-surface-1);
      border: none;
      border-radius: 20px;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      cursor: default;
    }

    .trackpad-surface:active, .trackpad-surface.touching {
      background: var(--color-surface-2);
    }

    /* 下部コントロール群 (ドラッグ長押しバー ＋ コピー/ペースト) */
    .stick-bottom-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .stick-drag-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* 長押しバー (丸アイコン全廃・ボーダーレス・ミニマルバー) */
    .stick-drag-btn {
      width: 100%;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      position: relative;
      transition: background-color 0.12s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    /* バー中央のミニマルなインジケーター線 */
    .stick-drag-btn::after {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-ink);
      opacity: 0.25;
      transition: all 0.12s ease;
    }

    .stick-drag-btn:hover {
      background: var(--color-surface-2);
    }

    /* 長押し押下中の状態 (ネオンレッド反転・高コントラスト) */
    .stick-drag-btn.holding {
      background: #ff003b;
      transform: scale(0.98);
    }

    .stick-drag-btn.holding::after {
      background: #ffffff;
      opacity: 0.9;
      width: 48px;
    }

    /* --------------------------------------------------------------------------
       Live Presentation Camera (Doc Cam / Mobile WebCam)
       -------------------------------------------------------------------------- */
    .camera-main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 6px 12px max(16px, env(safe-area-inset-bottom, 16px)) 12px;
      box-sizing: border-box;
      min-height: 0;
      overflow: hidden;
    }

    .camera-viewfinder {
      flex: 1;
      background: #000000;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #liveCameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 24px;
    }

    .camera-spinner {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .camera-spinner.active {
      opacity: 1;
    }

    /* PC ホスト側: 右下コンパクトポップアップ小窓 (PiP) / フルスクリーン */
    .host-camera-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999990;
      opacity: 1;
      transition: opacity 0.2s ease;
    }

    .host-camera-overlay.hidden {
      display: none;
      opacity: 0;
    }

    .host-camera-window {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 320px;
      height: 214px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      background: #09090b;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
      border: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      pointer-events: auto;
      transform-origin: bottom right;
      animation: cameraPopIn 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  right 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cameraPopIn {
      0% {
        transform: scale(0.65) translateY(36px);
        opacity: 0;
      }
      70% {
        transform: scale(1.03) translateY(-3px);
        opacity: 1;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    .host-camera-window.fullscreen {
      right: 0 !important;
      bottom: 0 !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    .host-camera-window.pip-active {
      opacity: 0.45;
      transition: opacity 0.2s ease;
    }

    .host-camera-window.pip-active:hover {
      opacity: 0.95;
    }

    .host-camera-bar {
      height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 9, 11, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      user-select: none;
      cursor: grab;
      border: none;
    }

    .host-camera-window.fullscreen .host-camera-bar {
      cursor: default;
    }

    .host-camera-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #ffffff;
      opacity: 0.9;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #ff3b30;
      border-radius: 50%;
      animation: livePulse 1.8s infinite ease-in-out;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .host-camera-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .host-camera-actions .btn-icon {
      color: #ffffff;
      opacity: 0.75;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .host-camera-actions .btn-icon:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.12);
    }

    .host-camera-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #hostCameraVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000000;
    }
  </style>
</head>

  <script>
    // --------------------------------------------------------------------------
    // View Switcher
    // --------------------------------------------------------------------------
    function switchView(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
        window.scrollTo(0, 0);
      }

      // スマホリモコン側で、未接続のままスライドやトラックパッド画面に入った場合は操作をブロック
      if (connBlocker) {
        const isClient = typeof isPeerHost !== 'undefined' && !isPeerHost;
        const isConnected = lastConnectedState || 
                            (typeof peerConn !== 'undefined' && peerConn && peerConn.open) || 
                            (socket && socket.readyState === WebSocket.OPEN);
        if (isClient && !isConnected && (viewId === 'viewSlideSwitch' || viewId === 'viewTrackpad')) {
          clearTimeout(blockerTimeout);
          connBlocker.classList.remove('state-connected');
          connBlocker.classList.remove('hidden');
        } else if (viewId === 'viewToolMenu') {
          // メニュー画面ではブロッカーを隠し、ユーザーが自由にSCANやQRを選べるようにする
          connBlocker.classList.add('hidden');
        }
      }
    }

    const cardSlideSwitch = document.getElementById('cardSlideSwitch');
    const cardTrackpad = document.getElementById('cardTrackpad');
    const btnBackToMenu = document.getElementById('btnBackToMenu');

    if (cardSlideSwitch) cardSlideSwitch.addEventListener('click', () => switchView('viewSlideSwitch'));
    if (cardTrackpad) cardTrackpad.addEventListener('click', () => switchView('viewTrackpad'));
    if (btnBackToMenu) btnBackToMenu.addEventListener('click', () => {
      pauseTimer();
      switchView('viewToolMenu');
    });

    // --------------------------------------------------------------------------
    // Live Presentation Camera (Doc Cam / Mobile WebCam)
    // --------------------------------------------------------------------------
    // スマホ側要素
    const cardLiveCamera = document.getElementById('cardLiveCamera');
    const btnCameraBack = document.getElementById('btnCameraBack');
    const btnCameraFlip = document.getElementById('btnCameraFlip');
    const liveCameraVideo = document.getElementById('liveCameraVideo');
    const cameraLoadingSpinner = document.getElementById('cameraLoadingSpinner');

    // PC（ホスト）側要素
    const hostCameraOverlay = document.getElementById('hostCameraOverlay');
    const hostCameraWindow = document.getElementById('hostCameraWindow');
    const hostCameraHeader = document.getElementById('hostCameraHeader');
    const hostCameraVideo = document.getElementById('hostCameraVideo');
    const btnHostCameraPip = document.getElementById('btnHostCameraPip');
    const btnHostCameraExpand = document.getElementById('btnHostCameraExpand');
    const btnHostCameraClose = document.getElementById('btnHostCameraClose');
    const iconHostExpand = document.getElementById('iconHostExpand');
    const iconHostCompress = document.getElementById('iconHostCompress');

    // カメラ状態管理
    let liveCameraStream = null;
    let activeMediaCall = null;
    let activeHostMediaCall = null;
    let isCameraStreaming = false;
    let currentCameraFacing = 'environment'; // デフォルトは背面（書画カメラとして資料・手元を写す）
    let isHostCameraFullscreen = false;

    // スマホ側: ライブカメラ配信の開始（タップした瞬間にPCへ即時ポップアップ通知）
    async function startLiveCamera() {
      // 1. タップした瞬間にPCへ「右下に小窓をポップアップせよ」と即時送信！
      sendPeerMessage({
        type: 'camera_start',
        layout: 'pip'
      });
      if (navigator.vibrate) try { navigator.vibrate(20); } catch(e) {}

      // 2. スマホ画面を全画面ファインダーに切り替え
      switchView('viewLiveCamera');
      if (cameraLoadingSpinner) cameraLoadingSpinner.classList.add('active');

      try {
        const constraints = {
          video: {
            facingMode: { ideal: currentCameraFacing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        liveCameraStream = stream;

        if (liveCameraVideo) {
          liveCameraVideo.srcObject = stream;
          liveCameraVideo.play().catch(() => {});
        }
        if (cameraLoadingSpinner) cameraLoadingSpinner.classList.remove('active');
        isCameraStreaming = true;

        // PeerJS 経由でメディアストリームを発信
        const targetHostId = (typeof targetHostPeerId !== 'undefined' && targetHostPeerId) ? targetHostPeerId : (typeof peerRoomId !== 'undefined' ? peerRoomId : null);
        if (peer && targetHostId) {
          try {
            activeMediaCall = peer.call(targetHostId, stream);
            if (activeMediaCall) {
              activeMediaCall.on('error', (err) => {
                console.warn('[Camera] Media call error:', err);
              });
            }
          } catch (e) {
            console.warn('[Camera] Failed to call peer:', e);
          }
        }
      } catch (err) {
        console.error('[Camera] getUserMedia failed:', err);
        if (cameraLoadingSpinner) cameraLoadingSpinner.classList.remove('active');
        sendPeerMessage({ type: 'camera_stop' });
        switchView('viewToolMenu');
      }
    }

    // スマホ側: ライブカメラ配信の終了
    function stopLiveCamera() {
      if (liveCameraStream) {
        liveCameraStream.getTracks().forEach(track => track.stop());
        liveCameraStream = null;
      }
      if (liveCameraVideo) {
        liveCameraVideo.srcObject = null;
      }
      if (activeMediaCall) {
        try { activeMediaCall.close(); } catch(e) {}
        activeMediaCall = null;
      }
      isCameraStreaming = false;

      // ホストへ停止を通知
      sendPeerMessage({ type: 'camera_stop' });
      switchView('viewToolMenu');
    }

    // スマホ側: インカメラ / アウトカメラのシームレス反転
    async function flipLiveCamera() {
      if (!isCameraStreaming) return;
      currentCameraFacing = (currentCameraFacing === 'environment') ? 'user' : 'environment';

      if (cameraLoadingSpinner) cameraLoadingSpinner.classList.add('active');

      if (liveCameraStream) {
        liveCameraStream.getTracks().forEach(t => t.stop());
      }

      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentCameraFacing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        liveCameraStream = newStream;

        if (liveCameraVideo) {
          liveCameraVideo.srcObject = newStream;
          liveCameraVideo.play().catch(() => {});
        }
        if (cameraLoadingSpinner) cameraLoadingSpinner.classList.remove('active');

        // WebRTC 通信中のビデオトラックを replaceTrack で瞬時に差し替え
        if (activeMediaCall && activeMediaCall.peerConnection) {
          const senders = activeMediaCall.peerConnection.getSenders();
          const videoSender = senders.find(s => s.track && s.track.kind === 'video');
          if (videoSender) {
            const newVideoTrack = newStream.getVideoTracks()[0];
            if (newVideoTrack) {
              videoSender.replaceTrack(newVideoTrack).catch(e => console.warn('[Camera] replaceTrack failed:', e));
            }
          }
        }
      } catch (err) {
        console.warn('[Camera] Flip failed:', err);
        if (cameraLoadingSpinner) cameraLoadingSpinner.classList.remove('active');
      }
    }

    // PC ホスト側: カメラウィンドウの表示・閉じる・レイアウト制御
    function openHostCameraWindow(layout) {
      if (!hostCameraOverlay || !hostCameraWindow) return;
      hostCameraOverlay.classList.remove('hidden');

      // バウンスポップアップアニメーションを確実に再トリガー
      hostCameraWindow.style.animation = 'none';
      void hostCameraWindow.offsetWidth; // リフロー強制
      hostCameraWindow.style.animation = '';

      setHostCameraLayout(layout || 'pip');
    }

    function closeHostCameraWindow() {
      if (document.pictureInPictureElement) {
        try { document.exitPictureInPicture(); } catch(e) {}
      }
      if (!hostCameraOverlay) return;
      hostCameraOverlay.classList.add('hidden');
      if (hostCameraVideo) {
        hostCameraVideo.srcObject = null;
      }
      if (activeHostMediaCall) {
        try { activeHostMediaCall.close(); } catch(e) {}
        activeHostMediaCall = null;
      }
    }

    // OS最前面フローティングウィンドウ（Picture-in-Picture）の自動起動トライ
    async function tryAutoEnterPip() {
      if (!document.pictureInPictureEnabled || !hostCameraVideo) return;
      try {
        if (document.pictureInPictureElement !== hostCameraVideo) {
          await hostCameraVideo.requestPictureInPicture();
          console.log('[Camera PiP] 自動最前面フローティング起動に成功しました');
        }
      } catch (err) {
        console.warn('[Camera PiP] 自動起動はスキップされました（画面内小窓で表示）:', err.message);
      }
    }

    function setHostCameraLayout(layout) {
      if (!hostCameraWindow) return;
      if (layout === 'fullscreen') {
        isHostCameraFullscreen = true;
        hostCameraWindow.classList.add('fullscreen');
        if (iconHostExpand) iconHostExpand.style.display = 'none';
        if (iconHostCompress) iconHostCompress.style.display = 'block';
      } else {
        isHostCameraFullscreen = false;
        hostCameraWindow.classList.remove('fullscreen');
        if (iconHostExpand) iconHostExpand.style.display = 'block';
        if (iconHostCompress) iconHostCompress.style.display = 'none';
      }
    }

    // PC側: 最前面ウィンドウ（Picture-in-Picture）の切り替えボタン
    if (btnHostCameraPip) {
      btnHostCameraPip.addEventListener('click', async () => {
        if (!document.pictureInPictureEnabled || !hostCameraVideo) return;
        try {
          if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
          } else {
            await hostCameraVideo.requestPictureInPicture();
          }
        } catch (err) {
          console.warn('[Camera PiP] PiP切り替えエラー:', err);
        }
      });
    }

    // Video要素のPiP状態イベントリスナー
    if (hostCameraVideo) {
      hostCameraVideo.addEventListener('enterpictureinpicture', () => {
        console.log('[Camera PiP] Enter Picture-in-Picture');
        if (hostCameraWindow) hostCameraWindow.classList.add('pip-active');
      });
      hostCameraVideo.addEventListener('leavepictureinpicture', () => {
        console.log('[Camera PiP] Leave Picture-in-Picture');
        if (hostCameraWindow) hostCameraWindow.classList.remove('pip-active');
      });
    }

    // PC側: ウィンドウの全画面切り替えボタン

    // --------------------------------------------------------------------------
    const trackpadSurface = document.getElementById('trackpadSurface');

    // 高精度サブピクセル・アキュムレータ (端数を完全保持してカクつきを完全排除)
    let touchTracking = new Map(); // touchId -> { curX, curY, startX, startY, startTime }

    let accumY = 0;
    let accumScroll = 0;

    function trackpadSyncLoop() {
      // 整数ピクセル分を取り出して送信（roundで微小移動も直ちに送信しカクつき排除）
      const moveX = Math.round(accumX);
      const moveY = Math.round(accumY);

      if (moveX !== 0 || moveY !== 0) {
        sendWsPayload({ type: 'mouse_move', dx: moveX, dy: moveY });
        accumX -= moveX;
        accumY -= moveY;
      }

      // 2本指スクロール
      const scrollY = Math.round(accumScroll);
      if (scrollY !== 0) {
        sendWsPayload({ type: 'mouse_scroll', delta: scrollY });
        accumScroll -= scrollY;
      }

      requestAnimationFrame(trackpadSyncLoop);
    }

    if (trackpadSurface) {
      trackpadSurface.addEventListener('touchstart', (e) => {
        e.preventDefault();
        trackpadSurface.classList.add('touching');

        const touches = e.targetTouches;

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          touchTracking.set(t.identifier, {
            curX: t.clientX,
            curY: t.clientY,
            startX: t.clientX,
            startY: t.clientY,
            startTime: Date.now()
          });
        }

        // 2本指タップ候補の検出
        if (touches.length === 2) {
          twoFingerStartTime = Date.now();
          twoFingerCandidate = true;
          if (directDragTimer) { clearTimeout(directDragTimer); directDragTimer = null; }
        } else if (touches.length === 1 && !isHoldingDrag) {
          twoFingerCandidate = false;
          // トラックパッド直接長押し判定: 380ms 静止でドラッグ開始
          const t = touches[0];
          directDragTimer = setTimeout(() => {
            if (touchTracking.has(t.identifier) && e.targetTouches.length === 1) {
              const info = touchTracking.get(t.identifier);
              const dist = Math.hypot(info.curX - info.startX, info.curY - info.startY);
              if (dist < 10 && !isHoldingDrag && !isDirectDragging) {
                isDirectDragging = true;

        e.preventDefault();

        const touches = e.targetTouches;

        if (touches.length === 1) {
          // 1本指: カーソル移動
          const t = touches[0];
          const prev = touchTracking.get(t.identifier);
          if (prev) {
            const rawDx = t.clientX - prev.curX;
            const rawDy = t.clientY - prev.curY;
            prev.curX = t.clientX;
            prev.curY = t.clientY;

            const totalMoved = Math.hypot(t.clientX - prev.startX, t.clientY - prev.startY);
            if (totalMoved > 10 && directDragTimer && !isDirectDragging) {
              clearTimeout(directDragTimer);
              directDragTimer = null;
            }

            const dist = Math.hypot(rawDx, rawDy);
            if (dist > 0) {
              const sens = 0.7 + (currentSensitivity * 0.13);
              const accel = dist < 2.5 ? 1.0 : Math.min(2.5, 1.0 + (dist - 2.5) * 0.1);

              accumX += rawDx * sens * accel;
              accumY += rawDy * sens * accel;

          }

          // 2本指: スクロール
          if (directDragTimer) { clearTimeout(directDragTimer); directDragTimer = null; }

          const t0 = touches[0];
          const t1 = touches[1];
          const prev0 = touchTracking.get(t0.identifier);
          const prev1 = touchTracking.get(t1.identifier);
          if (prev0 && prev1) {
            const dy0 = t0.clientY - prev0.curY;
            const dy1 = t1.clientY - prev1.curY;
            prev0.curX = t0.clientX;
            prev0.curY = t0.clientY;
            prev1.curX = t1.clientX;
            prev1.curY = t1.clientY;

            // 移動量が大きければ2本指タップ候補をキャンセル
            const move0 = Math.hypot(t0.clientX - prev0.startX, t0.clientY - prev0.startY);
            const move1 = Math.hypot(t1.clientX - prev1.startX, t1.clientY - prev1.startY);
            if (move0 > 8 || move1 > 8) {
              twoFingerCandidate = false;
            }

            // ★ スクロール上下反転 (-=)
            accumScroll -= ((dy0 + dy1) / 2) * 1.6;
          }
        }
      }, { passive: false });

        const now = Date.now();
        if (directDragTimer) {
          clearTimeout(directDragTimer);
          directDragTimer = null;
        }

        // 直接長押しドラッグ中だった場合は終了
        if (isDirectDragging) {
          isDirectDragging = false;

        if (twoFingerCandidate && (now - twoFingerStartTime < 300) && e.targetTouches.length === 0) {
          twoFingerCandidate = false;

            if (e.targetTouches.length === 0 && duration < 280 && dist < 7 &&

          }

          trackpadSurface.classList.remove('touching');
          accumX = 0;
          accumY = 0;
          accumScroll = 0;
          twoFingerCandidate = false;
        }

    }

    let cameraStream = null;

    let barcodeDetector = null;
    if ('BarcodeDetector' in window) {

    async function openCameraScanner() {
      cameraModal.classList.add('active');
      if (scanError) {
        scanError.style.display = 'none';
        scanError.textContent = '';
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showScanError('Camera not supported on this browser');

      try {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

          try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' },
              audio: false
            });
          } catch (e2) {
            cameraStream = await navigator.mediaDevices.getUserMedia({
              video: true,
              audio: false
            });
          }

        scanVideo.srcObject = cameraStream;
        scanVideo.setAttribute('playsinline', 'true'); // iOS Safari対策
        await scanVideo.play();
        startScanLoop();

    function startScanLoop() {

        if (!cameraStream || scanVideo.readyState < 2) {
          scanAnimationId = requestAnimationFrame(scanStep);
          return;
        }

        const width = scanVideo.videoWidth;
        const height = scanVideo.videoHeight;
        if (width === 0 || height === 0) {
          scanAnimationId = requestAnimationFrame(scanStep);
          return;
        }

        let detectedUrl = null;

        // 1. 高速なNative BarcodeDetector（Android Chrome等）
        if (barcodeDetector) {
          try {
            const barcodes = await barcodeDetector.detect(scanVideo);
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              detectedUrl = barcodes[0].rawValue.trim();

            scanCanvas.width = width;
            scanCanvas.height = height;
            scanCtx.drawImage(scanVideo, 0, 0, width, height);

            const qrCode = window.jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert'
            });
            if (qrCode && qrCode.data) {
              detectedUrl = qrCode.data.trim();
            }
          } catch (e) {}
        }

        if (detectedUrl && (detectedUrl.startsWith('http://') || detectedUrl.startsWith('https://'))) {
          if (navigator.vibrate) {
            try { navigator.vibrate(100); } catch (e) {}
          }
          closeCameraScanner();

            const u = new URL(detectedUrl);
            const roomParam = u.searchParams.get('room');
            if (roomParam) {
              window.location.href = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(roomParam)}`;
              return;
            }
            const serverParam = u.searchParams.get('server');
            const targetServer = serverParam || u.origin;
            localStorage.setItem('wss_server_target', targetServer);
            if (checkIsStaticHost()) {
              window.location.href = `${window.location.origin}${window.location.pathname}?server=${encodeURIComponent(targetServer)}`;
              return;
            }
          } catch (e) {}
          window.location.href = detectedUrl;
          return;
        }

        scanAnimationId = requestAnimationFrame(scanStep);
      };

    }
