    // --------------------------------------------------------------------------
    // 静的ホスト判定（Vercel, Cloudflare Pages, GitHub Pages等の静的CDN環境）
    // --------------------------------------------------------------------------
    function checkIsStaticHost() {
      const host = window.location.hostname;
      return host.endsWith('.vercel.app') ||
             host.endsWith('.pages.dev') ||
             host.endsWith('.github.io') ||
             (host !== 'localhost' && host !== '127.0.0.1' && !host.includes('trycloudflare.com'));
    }

    // --------------------------------------------------------------------------
    // 接続先ターゲット解決 (Vercel / Cloudflare Pages 静的ホスト & ローカル両対応)
    // --------------------------------------------------------------------------
    function getTargetServerConfig() {
      const urlParams = new URLSearchParams(window.location.search);
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const isStaticHost = checkIsStaticHost();

      let rawServer = urlParams.get('server') || '';
      // localhost以外（Vercel等の静的ホスト）でのみlocalStorageのカスタムサーバーを使用
      if (!rawServer && !isLocalHost) {
        rawServer = localStorage.getItem('wss_server_target') || '';
      }
      if (!rawServer && !isStaticHost) {
        rawServer = window.location.origin;
      }

      if (rawServer) {
        let httpOrigin = rawServer.trim();
        if (!httpOrigin.startsWith('http://') && !httpOrigin.startsWith('https://')) {
          const isSsl = httpOrigin.includes('trycloudflare.com') || window.location.protocol === 'https:';
          httpOrigin = `${isSsl ? 'https:' : 'http:'}//${httpOrigin}`;
        }
        try {
          const u = new URL(httpOrigin);
          const isSecure = u.protocol === 'https:';
          const wsUrl = `${isSecure ? 'wss:' : 'ws:'}//${u.host}`;
          if (!isLocalHost) {
            localStorage.setItem('wss_server_target', u.origin);
          }
          return {
            httpOrigin: u.origin,
            wsUrl: wsUrl,
            host: u.host,
            hasCustomServer: true
          };
        } catch (e) {}
      }

      const isHttps = window.location.protocol === 'https:';
      return {
        httpOrigin: window.location.origin,
        wsUrl: `${isHttps ? 'wss:' : 'ws:'}//${window.location.host}`,
        host: window.location.host,
        hasCustomServer: false
      };
    }

    // --------------------------------------------------------------------------
    // Server Info & QR (クライアント側動的生成 & Vercel / Pages対応)
    // --------------------------------------------------------------------------
    let serverInfo = null;
    let activeQrTab = 'tunnel';

    const qrImage = document.getElementById('qrImage');
    const remoteUrlDisplay = document.getElementById('remoteUrlDisplay');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const inputServerUrl = document.getElementById('inputServerUrl');
    const btnSaveServerUrl = document.getElementById('btnSaveServerUrl');

    async function renderQrCode(targetUrl) {
      if (!targetUrl) return;
      if (remoteUrlDisplay) remoteUrlDisplay.textContent = targetUrl;
      try {
        if (window.QRCodeLib && window.QRCodeLib.toDataURL) {
          const dataUrl = await window.QRCodeLib.toDataURL(targetUrl, {
            margin: 2,
            width: 260,
            color: { dark: '#181818', light: '#ffffff' }
          });
          if (qrImage) qrImage.src = dataUrl;
          return;
        }
      } catch (e) {}

      // フォールバック
      if (serverInfo) {
        if (activeQrTab === 'tunnel' && serverInfo.tunnelQrDataUrl) {
          if (qrImage) qrImage.src = serverInfo.tunnelQrDataUrl;
        } else if (serverInfo.localQrDataUrl) {
          if (qrImage) qrImage.src = serverInfo.localQrDataUrl;
        }
      }
    }

    // スマホからアクセス可能なPCホスト接続用URLを確実に解決するヘルパー
    function getHostJoinUrl() {
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      let baseOrigin = `${window.location.origin}${window.location.pathname}`.replace(/\/$/, '');

      if (isLocalHost) {
        // ローカルPC環境の場合、スマホから直接通信可能なトンネルURL（最優先: 4G/5G・別Wi-Fi対応）またはローカルIPを使用
        if (serverInfo && serverInfo.tunnelRemoteUrl) {
          baseOrigin = serverInfo.tunnelRemoteUrl.replace(/\/$/, '');
        } else if (serverInfo && serverInfo.localRemoteUrl) {
          baseOrigin = serverInfo.localRemoteUrl.replace(/\/$/, '');
        }
      }

      if (peerRoomId) {
        // WebRTC ルームIDと WebSocketサーバーターゲットを同時に付与（デュアル接続冗長性）
        if (isLocalHost && serverInfo && serverInfo.tunnelRemoteUrl) {
          const tunnelHost = serverInfo.tunnelRemoteUrl.replace(/\/$/, '');
          return `${tunnelHost}/?room=${peerRoomId}&server=${encodeURIComponent(tunnelHost)}`;
        } else if (isLocalHost && serverInfo && serverInfo.localRemoteUrl) {
          const localHost = serverInfo.localRemoteUrl.replace(/\/$/, '');
          return `${localHost}/?room=${peerRoomId}&server=${encodeURIComponent(localHost)}`;
        }
        return `${baseOrigin}/?room=${peerRoomId}`;
      }

      return baseOrigin;
    }

    async function updateQrDisplay() {
      const cfg = getTargetServerConfig();
      const isStaticHost = checkIsStaticHost();
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      let targetUrl = '';

      // PC側でWebRTCルームID（peerRoomId）が準備できている場合は最優先でスマホ接続URLを生成
      if (peerRoomId) {
        targetUrl = getHostJoinUrl();
      } else if (activeQrTab === 'tunnel') {
        if (serverInfo && serverInfo.tunnelRemoteUrl) {
          const savedDeployHost = localStorage.getItem('wss_deploy_host') || '';
          const baseHost = isStaticHost 
            ? `${window.location.origin}${window.location.pathname}` 
            : (savedDeployHost || serverInfo.tunnelRemoteUrl);
          
          if (baseHost.includes('?server=')) {
            targetUrl = baseHost;
          } else if (baseHost === serverInfo.tunnelRemoteUrl) {
            targetUrl = serverInfo.tunnelRemoteUrl;
          } else {
            targetUrl = `${baseHost.replace(/\/$/, '')}/?server=${encodeURIComponent(serverInfo.tunnelRemoteUrl)}`;
          }
        } else if (cfg.hasCustomServer && !isLocalHost) {
          targetUrl = isStaticHost
            ? `${window.location.origin}${window.location.pathname}?server=${encodeURIComponent(cfg.httpOrigin)}`
            : cfg.httpOrigin;
        } else {
          targetUrl = getHostJoinUrl();
        }
      } else {
        if (serverInfo && serverInfo.localRemoteUrl) {
          targetUrl = serverInfo.localRemoteUrl;
        } else {
          targetUrl = getHostJoinUrl();
        }
      }

      await renderQrCode(targetUrl);
    }

    async function loadServerInfo() {
      const cfg = getTargetServerConfig();
      const isStaticHost = checkIsStaticHost();
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

      // 静的ホスト（Vercel）でカスタムサーバーが指定されていない場合はAPI取得をスキップ
      if (isStaticHost && !cfg.hasCustomServer) {
        return;
      }

      // バックエンドAPIから情報取得
      try {
        const res = await fetch(`${cfg.httpOrigin}/api/info`);
        if (res.ok) {
          serverInfo = await res.json();
        }
      } catch (err) {}

      if (inputServerUrl) {
        const savedDeploy = localStorage.getItem('wss_deploy_host');
        if (savedDeploy && isLocalHost) {
          inputServerUrl.value = savedDeploy;
        } else if (serverInfo && serverInfo.tunnelRemoteUrl) {
          inputServerUrl.value = serverInfo.tunnelRemoteUrl;
        } else if (cfg.hasCustomServer && !isLocalHost) {
          inputServerUrl.value = cfg.httpOrigin;
        }
      }

      await updateQrDisplay();
    }

    if (btnSaveServerUrl && inputServerUrl) {
      btnSaveServerUrl.addEventListener('click', () => {
        let val = inputServerUrl.value.trim();
        if (val) {
          if (!val.startsWith('http://') && !val.startsWith('https://')) {
            val = `https://${val}`;
          }
          try {
            const u = new URL(val);
            if (u.hostname.endsWith('.vercel.app') || u.hostname.endsWith('.pages.dev') || u.hostname.endsWith('.github.io')) {
              localStorage.setItem('wss_deploy_host', u.origin);
              updateQrDisplay();
              if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
              return;
            }
            localStorage.setItem('wss_server_target', u.origin);
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('server', u.origin);
            window.location.href = newUrl.toString();
          } catch (e) {}
        }
      });

      inputServerUrl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          btnSaveServerUrl.click();
        }
      });
    }

    const btnRefreshTunnel = document.getElementById('btnRefreshTunnel');
    if (btnRefreshTunnel) {
      btnRefreshTunnel.addEventListener('click', async () => {
        const svgIcon = btnRefreshTunnel.querySelector('svg');
        if (svgIcon) svgIcon.style.animation = 'spin 0.8s linear infinite';
        try {
          const cfg = getTargetServerConfig();
          const res = await fetch(`${cfg.httpOrigin}/api/refresh-tunnel`, { method: 'POST' });
          const data = await res.json();
          if (data.tunnelRemoteUrl) {
            if (!serverInfo) serverInfo = {};
            serverInfo.tunnelRemoteUrl = data.tunnelRemoteUrl;
            serverInfo.hasTunnel = true;
            await updateQrDisplay();
            if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) {}
          }
        } catch (e) {
          loadServerInfo();
        } finally {
          setTimeout(() => {
            if (svgIcon) svgIcon.style.animation = '';
          }, 800);
        }
      });
    }

    copyUrlBtn.addEventListener('click', () => {
      const url = remoteUrlDisplay.textContent;
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        copyUrlBtn.style.color = 'var(--color-semantic-success)';
        setTimeout(() => { copyUrlBtn.style.color = ''; }, 1500);
      });
    });

    // --------------------------------------------------------------------------
    // WebSocket 接続 (PINコード認証なし・即時操作可能)
    // --------------------------------------------------------------------------
    let socket = null;
    const menuWsDot = document.getElementById('menuWsDot');
    const remoteWsDot = document.getElementById('remoteWsDot');

    function connectWebSocket() {
      const cfg = getTargetServerConfig();
      const isStaticHost = checkIsStaticHost();
      // 静的ホスト（Vercel）でカスタムサーバー（?server=）が指定されていない場合はWebSocketを起動しない（P2Pを使用）
      if (isStaticHost && !cfg.hasCustomServer) {
        return;
      }

      try {
        socket = new WebSocket(cfg.wsUrl);
      } catch(e) {
        return;
      }

      socket.addEventListener('open', () => {
        updateWsIndicator(true);
        const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        socket.send(JSON.stringify({
          type: 'register',
          clientType: isLocalHost ? 'pc' : 'mobile'
        }));
        // スマホ側でWebSocketが接続できた場合、WebRTC待機中であっても即時アンロックして操作可能にする
        if (!isLocalHost) {
          triggerPairingAnimation();
        }
        requestWakeLock();
      });

      socket.addEventListener('message', async (event) => {
        try {
          const msg = JSON.parse(event.data);
          // トンネルURLが再発行された際にQRコードをリアルタイム自動更新
          if (msg.type === 'tunnel_update') {
            if (!serverInfo) serverInfo = {};
            serverInfo.tunnelRemoteUrl = msg.tunnelRemoteUrl;
            serverInfo.hasTunnel = msg.hasTunnel;
            await updateQrDisplay();
          }
          // PCホスト側でWebSocket経由のリモート操作（リレー）を受信
          if (isPeerHost && msg) {
            handleIncomingPeerData(msg);
          }
        } catch (e) {}
      });

      socket.addEventListener('close', () => {
        updateWsIndicator(false);
        if (!isStaticHost || cfg.hasCustomServer) {
          setTimeout(connectWebSocket, 2000);
        }
      });

      socket.addEventListener('error', () => {});
    }

    const unconnectedNotice = document.getElementById('unconnectedNotice');
    const btnNoticeScan = document.getElementById('btnNoticeScan');
    if (btnNoticeScan) {
      btnNoticeScan.addEventListener('click', openCameraScanner);
    }

    let lastConnectedState = false;
    let toastTimeout = null;
    let currentRouteType = 'cloud'; // 'wifi' または 'cloud'

    // PeerJS DataConnection から RTCPeerConnection を確実に抽出するヘルパー
    function extractRtcPeerConnection() {
      if (typeof peerConn !== 'undefined' && peerConn) {
        if (peerConn.peerConnection) return peerConn.peerConnection;
        if (peerConn._peerConnection) return peerConn._peerConnection;
        if (peerConn.pc) return peerConn.pc;
        if (peerConn._negotiator && peerConn._negotiator._pc) return peerConn._negotiator._pc;
      }
      if (typeof peerConnections !== 'undefined' && peerConnections && peerConnections.length > 0) {
        for (const c of peerConnections) {
          if (c.peerConnection) return c.peerConnection;
          if (c._peerConnection) return c._peerConnection;
          if (c.pc) return c.pc;
          if (c._negotiator && c._negotiator._pc) return c._negotiator._pc;
        }
      }
      if (typeof peer !== 'undefined' && peer && peer._connections) {
        for (const k in peer._connections) {
          const arr = peer._connections[k];
          if (arr && arr[0]) {
            const c = arr[0];
            if (c.peerConnection) return c.peerConnection;
            if (c._peerConnection) return c._peerConnection;
            if (c.pc) return c.pc;
          }
        }
      }
      return null;
    }

    // WebRTC 内部接続統計 (getStats) による高精度なローカルWi-Fi直接通信のリアルタイム自動判定
    async function detectActualRouteType() {
      // 1. ローカルホストまたはローカルIPアクセス時（ホストPC、または同一LAN IP直結時）
      const host = window.location.hostname;
      if (host === 'localhost' || host === '127.0.0.1' || /^192\.168\./.test(host) || /^10\./.test(host)) {
        return 'wifi';
      }

      // 2. ホストPCから同期されたルートタイプがあれば最優先採用
      if (window.__syncedRouteType) {
        return window.__syncedRouteType;
      }

      // 3. WebRTC P2P ICE Candidate Pair の直接通信検査 (非リレー判定)
      const activeConn = extractRtcPeerConnection();
      if (activeConn && activeConn.getStats) {
        try {
          const stats = await activeConn.getStats();
          let hasDirectCandidatePair = false;
          let isRelayPair = false;

          stats.forEach(report => {
            if (report.type === 'candidate-pair') {
              const isSelected = report.state === 'succeeded' || report.selected || report.nominated || (report.currentRoundTripTime !== undefined);
              if (isSelected) {
                const localCand = stats.get(report.localCandidateId);
                const remoteCand = stats.get(report.remoteCandidateId);
                if (localCand && remoteCand) {
                  // クラウド中継サーバー（TURNリレー）経由の場合のみ「クラウド」
                  if (localCand.candidateType === 'relay' || remoteCand.candidateType === 'relay') {
                    isRelayPair = true;
                  } else {
                    // host または srflx（同一ルーターNAT直結）によるダイレクトP2P通信
                    hasDirectCandidatePair = true;
                  }
                }
              }
            }
          });

          if (hasDirectCandidatePair && !isRelayPair) {
            return 'wifi';
          }
        } catch (e) {}
      }

      // 4. WebSocket 接続先判定
      if (socket && socket.readyState === WebSocket.OPEN && socket.url) {
        if (/127\.0\.0\.1|localhost|192\.168\.|10\./.test(socket.url)) {
          return 'wifi';
        }
      }

      // 5. WebRTC DataChannel がアクティブで通信可能な場合
      // (設定されているのはSTUNサーバーのみであり、確立されたP2P接続は直接通信)
      const isClientPeerActive = typeof peerConn !== 'undefined' && peerConn && peerConn.open;
      const isHostPeerActive = typeof peerConnections !== 'undefined' && peerConnections && peerConnections.length > 0;
      if (isClientPeerActive || isHostPeerActive) {
        return 'wifi';
      }

      return 'cloud';
    }

    let lastPairingAnimTime = 0;
    const pageLoadTimestamp = Date.now();
    let blockerTimeout = null;

    // 接続待機＆接続完了ブロッキングオーバーレイの要素取得
    const connBlocker = document.getElementById('connectionBlocker');

    function isControllerViewActive() {
      const slideView = document.getElementById('viewSlideSwitch');
      const trackView = document.getElementById('viewTrackpad');
      const camView = document.getElementById('viewLiveCamera');
      return (slideView && slideView.classList.contains('active')) || 
             (trackView && trackView.classList.contains('active')) ||
             (camView && camView.classList.contains('active'));
    }

    function triggerConnectionAnimation() {
      // PC側（isPeerHost === true）では全画面アニメーションを表示しない（作業やQR表示を邪魔しない）
      if (typeof isPeerHost !== 'undefined' && isPeerHost) return;
      if (!connBlocker) return;

      // 接続完了状態に切り替え、1.4秒のワイヤーアニメーションをリフロー再描画
      connBlocker.classList.remove('hidden');
      connBlocker.classList.remove('state-connected');
      void connBlocker.offsetWidth; // リフロー強制
      requestAnimationFrame(() => {
        connBlocker.classList.add('state-connected');
      });

      if (navigator.vibrate) try { navigator.vibrate([40, 70, 45]); } catch (e) {}

      // 1.4秒ワイヤーアニメーション＋中央チェックマーク出現後、約2.1秒でフェードアウトして操作アンロック
      clearTimeout(blockerTimeout);
      blockerTimeout = setTimeout(() => {
        connBlocker.classList.add('hidden');
      }, 2100);
    }

    // スマホとPCのペアリングが成立した瞬間のみに発火させる（ページ初期読込時の誤発火を完全防止）
    function triggerPairingAnimation() {
      const now = Date.now();
      // ページ読み込み後1.0秒以内の初期化ガード、または直近2.2秒以内の連続発火を抑制
      if (now - pageLoadTimestamp < 1000) return;
      if (now - lastPairingAnimTime < 2200) return;
      lastPairingAnimTime = now;

      const pills = [
        document.getElementById('menuConnPill'),
        document.getElementById('remoteConnPill'),
        document.getElementById('trackpadConnPill'),
        document.getElementById('cameraConnPill')
      ];
      pills.forEach(p => {
        if (!p) return;
        p.setAttribute('data-route', 'wifi');
        p.classList.remove('disconnected');
        p.classList.add('connected');
      });

      triggerConnectionAnimation();
    }

    async function updateWsIndicator(isConnected) {
      const isPeerActive = (typeof isPeerHost !== 'undefined' && isPeerHost && peerConnections && peerConnections.length > 0) || 
                           (typeof peerConn !== 'undefined' && peerConn && peerConn.open);
      const isWsActive = socket && socket.readyState === WebSocket.OPEN;
      const connected = (typeof isConnected === 'boolean' && isConnected) || isPeerActive || isWsActive;

      if (connected) {
        currentRouteType = await detectActualRouteType();
      }

      const pills = [
        document.getElementById('menuConnPill'),
        document.getElementById('remoteConnPill'),
        document.getElementById('trackpadConnPill'),
        document.getElementById('cameraConnPill')
      ];

      pills.forEach(pill => {
        if (!pill) return;
        pill.setAttribute('data-route', currentRouteType);
        if (connected) {
          pill.classList.remove('disconnected');
          pill.classList.add('connected');
        } else {
          pill.classList.remove('connected');
          pill.classList.add('disconnected');
        }
      });

      // スマホ（リモコン）側で、かつコントローラー画面（スライドやトラックパッド）操作中に未接続になった場合のみブロック
      const isClientDevice = typeof isPeerHost !== 'undefined' && !isPeerHost;
      if (connBlocker) {
        if (!connected && isClientDevice && isControllerViewActive()) {
          clearTimeout(blockerTimeout);
          connBlocker.classList.remove('state-connected');
          connBlocker.classList.remove('hidden');
        }
      }

      lastConnectedState = connected;

      if (unconnectedNotice) {
        const isStaticHost = checkIsStaticHost();
        unconnectedNotice.style.display = (!connected && isStaticHost) ? 'flex' : 'none';
      }
    }

    // --------------------------------------------------------------------------
    // プレゼン操作 (タイマー & キー送信)
    // --------------------------------------------------------------------------
    let currentSlide = 1;
    const mainTimerText = document.getElementById('mainTimerText');
    const timerToggleBtn = document.getElementById('timerToggleBtn');
    const btnResetTimerDirect = document.getElementById('btnResetTimerDirect');
    const flashOverlay = document.getElementById('flashOverlay');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');

    // ストップウォッチ (デフォルト: カウントアップ方式 00:00スタート)
    let targetTotalSeconds = 0;
    let remainingSeconds = 0;
    let elapsedSeconds = 0;
    let timerInterval = null;
    let isTimerRunning = false;

    function formatTimeDisplay(sec, isCountdown) {
      if (isCountdown) {
        if (sec >= 0) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        } else {
          const abs = Math.abs(sec);
          const m = Math.floor(abs / 60);
          const s = abs % 60;
          return `-${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
      } else {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
    }

    function renderTimerUI() {
      const isCountdown = targetTotalSeconds > 0;
      const displaySec = isCountdown ? remainingSeconds : elapsedSeconds;
      if (mainTimerText) {
        mainTimerText.textContent = formatTimeDisplay(displaySec, isCountdown);
      }

      if (timerToggleBtn) {
        if (isTimerRunning) {
          timerToggleBtn.classList.remove('timer-paused');
          timerToggleBtn.classList.add('timer-running');
        } else {
          timerToggleBtn.classList.add('timer-paused');
          timerToggleBtn.classList.remove('timer-running');
        }
      }
    }

    function startTimer() {
      if (isTimerRunning) return;
      isTimerRunning = true;
      timerInterval = setInterval(() => {
        if (targetTotalSeconds > 0) remainingSeconds--;
        else elapsedSeconds++;
        renderTimerUI();
      }, 1000);
      renderTimerUI();
    }

    function pauseTimer() {
      if (!isTimerRunning) return;
      clearInterval(timerInterval);
      isTimerRunning = false;
      renderTimerUI();
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = targetTotalSeconds;
      elapsedSeconds = 0;
      renderTimerUI();
    }

    // 中段タイマーボタン: テキスト・ボタンタップで停止/再開
    if (timerToggleBtn) {
      timerToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isTimerRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
      });
    }

    // ヘッダータイマーリセットボタン
    if (btnResetTimerDirect) {
      btnResetTimerDirect.addEventListener('click', (e) => {
        e.stopPropagation();
        resetTimer();
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
      });
    }

    let lastCommandTime = 0;
    const COMMAND_DEBOUNCE_MS = 200;

    function sendCommand(action) {
      const now = Date.now();
      if (now - lastCommandTime < COMMAND_DEBOUNCE_MS) return;
      lastCommandTime = now;

      flashOverlay.className = 'flash-overlay active';
      setTimeout(() => { flashOverlay.className = 'flash-overlay'; }, 70);

      if (action === 'next') {
        currentSlide++;
      } else if (action === 'prev') {
        currentSlide = Math.max(1, currentSlide - 1);
      }

      if (typeof sendPeerMessage === 'function') {
        sendPeerMessage({ type: 'command', action: action, slide: currentSlide });
      }

      sendToNativeServer({ type: 'command', action });
    }

    function bindAction(el, action) {
      if (!el) return;
      el.addEventListener('pointerdown', () => {
        el.classList.add('pressed');
        sendCommand(action);
      });
      el.addEventListener('pointerup', () => el.classList.remove('pressed'));
      el.addEventListener('pointercancel', () => el.classList.remove('pressed'));
      el.addEventListener('click', () => {
        sendCommand(action);
      });
    }

    bindAction(btnNext, 'next');
    bindAction(btnPrev, 'prev');

    // Swipe Gesture
    let touchStartX = 0;
    let touchStartY = 0;
    const remoteArea = document.getElementById('remoteArea');

    remoteArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    remoteArea.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
        if (diffX < 0) {
          btnNext.classList.add('pressed');
          setTimeout(() => btnNext.classList.remove('pressed'), 150);
          sendCommand('next');
        } else {
          btnPrev.classList.add('pressed');
          setTimeout(() => btnPrev.classList.remove('pressed'), 150);
          sendCommand('prev');
        }
      }
    }, { passive: true });

    // --------------------------------------------------------------------------
    // 1. Slide Settings Modal (タイマー設定専用)
    // --------------------------------------------------------------------------
    const settingsBtn = document.getElementById('settingsBtn');
    const slideSettingsModal = document.getElementById('slideSettingsModal');
    const slideSettingsCloseX = document.getElementById('slideSettingsCloseX');
    const slideSettingsDoneBtn = document.getElementById('slideSettingsDoneBtn');
    const resetTimerBtn = document.getElementById('resetTimerBtn');
    const inputMinutes = document.getElementById('inputMinutes');
    const inputSeconds = document.getElementById('inputSeconds');
    const applyTimeBtn = document.getElementById('applyTimeBtn');
    const toggleAwakeSlide = document.getElementById('toggleAwakeSlide');
    const presetButtons = document.querySelectorAll('.preset-btn');

    function openSlideSettings() {
      if (targetTotalSeconds > 0) {
        inputMinutes.value = Math.floor(targetTotalSeconds / 60);
        inputSeconds.value = targetTotalSeconds % 60;
      } else {
        inputMinutes.value = 0;
        inputSeconds.value = 0;
      }
      if (toggleAwakeSlide) toggleAwakeSlide.checked = isAwakeEnabled;
      if (slideSettingsModal) slideSettingsModal.classList.add('active');
    }

    function closeSlideSettings() {
      if (slideSettingsModal) slideSettingsModal.classList.remove('active');
    }

    if (settingsBtn) settingsBtn.addEventListener('click', openSlideSettings);
    if (slideSettingsCloseX) slideSettingsCloseX.addEventListener('click', closeSlideSettings);
    if (slideSettingsDoneBtn) slideSettingsDoneBtn.addEventListener('click', closeSlideSettings);
    if (slideSettingsModal) {
      slideSettingsModal.addEventListener('click', (e) => {
        if (e.target === slideSettingsModal) closeSlideSettings();
      });
    }

    if (resetTimerBtn) {
      resetTimerBtn.addEventListener('click', () => {
        resetTimer();
        closeSlideSettings();
      });
    }

    if (applyTimeBtn) {
      applyTimeBtn.addEventListener('click', () => {
        const mins = parseInt(inputMinutes.value, 10) || 0;
        const secs = parseInt(inputSeconds.value, 10) || 0;
        const totalSec = mins * 60 + secs;
        if (totalSec >= 0) {
          presetButtons.forEach(b => b.classList.remove('selected'));
          targetTotalSeconds = totalSec;
          resetTimer();
          closeSlideSettings();
        }
      });
    }

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const mins = parseInt(btn.getAttribute('data-mins'), 10);
        const secs = parseInt(btn.getAttribute('data-secs'), 10);
        inputMinutes.value = mins;
        inputSeconds.value = secs;
        targetTotalSeconds = mins * 60 + secs;
        resetTimer();
      });
    });

    // --------------------------------------------------------------------------
    // 2. Trackpad Settings Modal (感度設定専用)
    // --------------------------------------------------------------------------
    const trackpadSettingsModal = document.getElementById('trackpadSettingsModal');
    const trackpadSettingsCloseX = document.getElementById('trackpadSettingsCloseX');
    const trackpadSettingsDoneBtn = document.getElementById('trackpadSettingsDoneBtn');
    const toggleAwakeTrackpad = document.getElementById('toggleAwakeTrackpad');

    function openTrackpadSettings() {
      if (inputSensitivity && sensitivityText) {
        inputSensitivity.value = currentSensitivity;
        sensitivityText.textContent = currentSensitivity;
      }
      if (toggleAwakeTrackpad) toggleAwakeTrackpad.checked = isAwakeEnabled;
      if (trackpadSettingsModal) trackpadSettingsModal.classList.add('active');
    }

    function closeTrackpadSettings() {
      if (trackpadSettingsModal) trackpadSettingsModal.classList.remove('active');
    }

    if (btnStickSettings) btnStickSettings.addEventListener('click', openTrackpadSettings);
    if (trackpadSettingsCloseX) trackpadSettingsCloseX.addEventListener('click', closeTrackpadSettings);
    if (trackpadSettingsDoneBtn) trackpadSettingsDoneBtn.addEventListener('click', closeTrackpadSettings);
    if (trackpadSettingsModal) {
      trackpadSettingsModal.addEventListener('click', (e) => {
        if (e.target === trackpadSettingsModal) closeTrackpadSettings();
      });
    }

    // --------------------------------------------------------------------------
    // Wake Lock (画面スリープ防止)
    // --------------------------------------------------------------------------
    let wakeLock = null;
    let isAwakeEnabled = true;
    const fallbackVideo = document.getElementById('fallbackVideo');

    async function requestWakeLock() {
      if (!isAwakeEnabled) return;
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        } else if (fallbackVideo) {
          try { await fallbackVideo.play(); } catch (e) {}
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      if (fallbackVideo) fallbackVideo.pause();
    }

    function setAwakeEnabled(enabled) {
      isAwakeEnabled = enabled;
      if (toggleAwakeSlide) toggleAwakeSlide.checked = enabled;
      if (toggleAwakeTrackpad) toggleAwakeTrackpad.checked = enabled;
      if (isAwakeEnabled) requestWakeLock();
      else releaseWakeLock();
    }

    if (toggleAwakeSlide) {
      toggleAwakeSlide.addEventListener('change', () => {
        setAwakeEnabled(toggleAwakeSlide.checked);
      });
    }

    if (toggleAwakeTrackpad) {
      toggleAwakeTrackpad.addEventListener('change', () => {
        setAwakeEnabled(toggleAwakeTrackpad.checked);
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isAwakeEnabled) requestWakeLock();
    });

    window.addEventListener('pointerdown', () => {
      if (isAwakeEnabled && (!wakeLock || wakeLock.released)) requestWakeLock();
    }, { once: false });

    // --------------------------------------------------------------------------
    // WebRTC (PeerJS) サーバーレス P2P 接続マネージャー
    // --------------------------------------------------------------------------
    let peer = null;
    let peerConn = null;
    let peerConnections = [];
    let isPeerHost = false;
    let peerRoomId = '';

    const hostWaitingCard = document.getElementById('hostWaitingCard');
    const hostConnectedPanel = document.getElementById('hostConnectedPanel');
    const hostQrImg = document.getElementById('hostQrImg');
    const hostRoomIdText = document.getElementById('hostRoomIdText');
    const hostSlideNum = document.getElementById('hostSlideNum');
    const hostBigTimer = document.getElementById('hostBigTimer');
    const hostWsDot = document.getElementById('hostWsDot');
    const btnCopyHostUrl = document.getElementById('btnCopyHostUrl');
    const btnHostPrev = document.getElementById('btnHostPrev');
    const btnHostNext = document.getElementById('btnHostNext');

    function sendPeerMessage(msg) {
      let sent = false;
      if (isPeerHost) {
        peerConnections.forEach(c => {
          if (c && c.open) {
            c.send(msg);
            sent = true;
          }
        });
      } else if (peerConn && peerConn.open) {
        peerConn.send(msg);
        sent = true;
      }

      // WebRTCが未開通または遮断されている場合、WebSocket経由で直接リレー送信
      if (!sent && socket && socket.readyState === WebSocket.OPEN) {
        try {
          const payload = typeof msg === 'string' ? msg : JSON.stringify(msg);
          socket.send(payload);
          sent = true;
        } catch (e) {}
      }

      // ホスト側自身での操作実行（Native Server直結）
      if (isPeerHost) {
        sendToNativeServer(msg);
      }
    }

    function updateHostDisplay() {
      if (hostSlideNum) hostSlideNum.textContent = currentSlide;
      if (hostBigTimer) {
        const isCountdown = targetTotalSeconds > 0;
        const displaySec = isCountdown ? remainingSeconds : elapsedSeconds;
        hostBigTimer.textContent = formatTimeDisplay(displaySec, isCountdown);
      }
    }

    function initWebRTCPeer() {
      if (typeof Peer === 'undefined') {
        console.warn('PeerJS not loaded');
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const queryRoom = urlParams.get('room');
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

      if (queryRoom) {
        // === スマホ（リモコン）側 ===
        isPeerHost = false;
        peerRoomId = queryRoom;
        if (connBlocker) {
          connBlocker.classList.remove('hidden');
          connBlocker.classList.remove('state-connected');
        }
        initClientPeer(queryRoom);
      } else if (!isMobile) {
        // === PC（大画面ホスト）側 === (QRコードを表示するため画面全体を初期ブロックしない)
        isPeerHost = true;
        if (connBlocker) {
          connBlocker.classList.add('hidden');
        }
        initHostPeer();
      } else {
        // スマホで直接開いた場合（メニュー画面を自由に操作可能にするため初期ブロッカーは非表示）
        isPeerHost = false;
        if (connBlocker) {
          connBlocker.classList.add('hidden');
        }
      }
    }

    // --------------------------------------------------------------------------
    // WebRTC PeerJS 設定 (Google公開STUNサーバーによる高信頼P2P直結)
    // --------------------------------------------------------------------------
    const PEER_CONFIG = {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' },
          { urls: 'stun:stun3.l.google.com:19302' },
          { urls: 'stun:stun4.l.google.com:19302' }
        ],
        iceCandidatePoolSize: 10
      }
    };

    // ホスト（PC側）の初期化
    function initHostPeer() {
      const generateId = () => 'mt' + Math.random().toString(36).substring(2, 8);
      const shortId = generateId();
      peerRoomId = shortId;

      try {
        peer = new Peer(shortId, PEER_CONFIG);
      } catch(e) {
        peer = new Peer(PEER_CONFIG);
      }

      peer.on('open', async (id) => {
        peerRoomId = id;
        console.log('[WebRTC Host] ルーム開設完了:', id);
        updateQrDisplay();
      });

      peer.on('connection', (conn) => {
        console.log('[WebRTC Host] スマホリモコンが接続されました');
        peerConnections.push(conn);
        conn.on('open', () => {
          updateWsIndicator(true);
          conn.send({ 
            type: 'sync_state', 
            slide: currentSlide, 
            isRunning: isTimerRunning
          });
          triggerPairingAnimation();
        });

        conn.on('data', (data) => {
          handleIncomingPeerData(data);
        });

        conn.on('close', () => {
          peerConnections = peerConnections.filter(c => c !== conn);
          if (peerConnections.length === 0) {
            updateWsIndicator(false);
          }
        });
      });

      peer.on('error', (err) => {
        console.warn('Peer host error:', err);
        if (err.type === 'unavailable-id') {
          setTimeout(initHostPeer, 500);
        }
      });

      // スマホからのライブカメラ映像コールを受信・自動応答
      peer.on('call', (call) => {
        console.log('[WebRTC Host] 受信カメラコール:', call);
        activeHostMediaCall = call;
        call.answer(); // 空ストリームで応答（スマホからの映像を受信）
        call.on('stream', (remoteStream) => {
          console.log('[WebRTC Host] リモートカメラストリーム受信成功');
          if (hostCameraVideo) {
            hostCameraVideo.srcObject = remoteStream;
            hostCameraVideo.play().then(() => {
              tryAutoEnterPip();
            }).catch(e => console.warn('[Camera] Video play error:', e));
          }
          openHostCameraWindow(currentHostCameraLayout);
        });
        call.on('close', () => {
          closeHostCameraWindow();
        });
        call.on('error', (err) => {
          console.warn('[WebRTC Host] Call error:', err);
        });
      });
    }

    // クライアント（スマホ側）の初期化
    let targetHostPeerId = null;
    function initClientPeer(targetHostId) {
      targetHostPeerId = targetHostId;
      peer = new Peer(PEER_CONFIG);

      peer.on('open', () => {
        console.log('[WebRTC Client] ホスト接続開始:', targetHostId);
        const conn = peer.connect(targetHostId, { reliable: true });
        peerConn = conn;

        conn.on('open', () => {
          console.log('[WebRTC Client] ホストとP2P接続確立！');
          updateWsIndicator(true);
          triggerPairingAnimation();
          if (navigator.vibrate) try { navigator.vibrate([60, 40, 60]); } catch(e) {}
        });

        conn.on('data', (data) => {
          if (data && data.type === 'sync_state') {
            if (data.slide) currentSlide = data.slide;
            if (typeof data.isRunning === 'boolean') {
              if (data.isRunning && !isTimerRunning) startTimer();
              else if (!data.isRunning && isTimerRunning) pauseTimer();
            }
          }
        });

        conn.on('close', () => {
          updateWsIndicator(false);
        });
      });

      peer.on('error', (err) => {
        console.warn('Peer client error:', err);
      });
    }

    // --------------------------------------------------------------------------
    // Native OS Server 通信管理 (Win32 Native API 物理操作直結)
    // --------------------------------------------------------------------------
    let nativeWs = null;
    let isConnectingNativeWs = false;

    function connectNativeServer() {
      if (isConnectingNativeWs) return;
      if (nativeWs && (nativeWs.readyState === WebSocket.OPEN || nativeWs.readyState === WebSocket.CONNECTING)) {
        return;
      }
      isConnectingNativeWs = true;

      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const isHttps = window.location.protocol === 'https:';
      const primaryWsUrl = `${isHttps ? 'wss:' : 'ws:'}//${window.location.host}`;
      const fallbackWsUrl = 'ws://127.0.0.1:3000';

      const targetUrl = isLocalHost ? primaryWsUrl : (checkIsStaticHost() ? fallbackWsUrl : primaryWsUrl);

      try {
        nativeWs = new WebSocket(targetUrl);
      } catch (err) {
        isConnectingNativeWs = false;
        setTimeout(connectNativeServer, 2000);
        return;
      }

      nativeWs.addEventListener('open', () => {
        isConnectingNativeWs = false;
        nativeWs.send(JSON.stringify({ type: 'register', clientType: 'pc_host' }));
        updateWsIndicator(true);
      });

      nativeWs.addEventListener('close', () => {
        isConnectingNativeWs = false;
        nativeWs = null;
        updateWsIndicator(false);
        setTimeout(connectNativeServer, 2000);
      });

      nativeWs.addEventListener('error', () => {
        isConnectingNativeWs = false;
      });
    }

    function sendToNativeServer(payload) {
      const msg = typeof payload === 'string' ? payload : JSON.stringify(payload);
      let sent = false;

      // 1. 専用Native OS WebSocket接続
      if (nativeWs && nativeWs.readyState === WebSocket.OPEN) {
        nativeWs.send(msg);
        sent = true;
      }
      // 2. 汎用メインWebSocket接続
      if (socket && socket.readyState === WebSocket.OPEN && socket !== nativeWs) {
        socket.send(msg);
        sent = true;
      }

      // 3. HTTP POST フォールバック (command/clipboard/key のみ。高頻度マウス移動では絶対にfetchしない！)
      const isMouseStream = payload && (payload.type === 'mouse_move' || payload.type === 'mouse_scroll');
      if (!isMouseStream && !sent) {
        try {
          fetch('http://127.0.0.1:3000/api/native', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: msg,
            mode: 'cors'
          }).catch(() => {});
        } catch (e) {}
      }

      if (!sent && (!nativeWs || nativeWs.readyState !== WebSocket.CONNECTING)) {
        connectNativeServer();
      }
      return sent;
    }

    // ホスト側でのコマンド・マウス操作受信処理 (Win32 Native API へ完全直結)
    function handleIncomingPeerData(data) {
      if (!data) return;

      // 1. スライド操作コマンド (OSの最前面PowerPoint / Googleスライド / PDF送り)
      if (data.type === 'command') {
        if (data.action === 'next') {
          currentSlide++;
        } else if (data.action === 'prev') {
          currentSlide = Math.max(1, currentSlide - 1);
        }
        updateHostDisplay();
        sendPeerMessage({ type: 'sync_state', slide: currentSlide });

        // Win32 Nativeキーストローク（keybd_event）を確実に実行
        sendToNativeServer(data);
      }
      // 2. OS物理マウスカーソル移動 (Win32 mouse_event 直結)
      else if (data.type === 'mouse_move') {
        sendToNativeServer(data);
      }
      // 3. マウスクリック (Win32 mouse_event 直結)
      else if (data.type === 'mouse_click') {
        sendToNativeServer(data);
      }
      // 4. マウスドラッグ・スクロール・クリップボード・キーボード
      else if (data.type === 'mouse_scroll' || data.type === 'mouse_drag' || 
                 data.type === 'clipboard' || data.type === 'keyboard_text' || 
                 data.type === 'keyboard_key') {
        sendToNativeServer(data);
      }
      // 5. ライブカメラ制御
      else if (data.type === 'camera_start') {
        openHostCameraWindow(data.layout);
        tryAutoEnterPip();
      }
      else if (data.type === 'camera_stop') {
        closeHostCameraWindow();
      }
      else if (data.type === 'camera_layout') {
        setHostCameraLayout(data.layout);
      }
      else if (data.type === 'camera_closed_by_host') {
        stopLiveCamera();
      }

    }

    if (btnCopyHostUrl) {
      btnCopyHostUrl.addEventListener('click', () => {
        const joinUrl = getHostJoinUrl();
        navigator.clipboard.writeText(joinUrl).then(() => {
          btnCopyHostUrl.style.color = 'var(--color-semantic-success)';
          setTimeout(() => { btnCopyHostUrl.style.color = ''; }, 1500);
        });
      });
    }

    if (btnHostPrev) {
      btnHostPrev.addEventListener('click', () => {
        currentSlide = Math.max(1, currentSlide - 1);
        updateHostDisplay();
        sendPeerMessage({ type: 'sync_state', slide: currentSlide });
        sendToNativeServer({ type: 'command', action: 'prev' });
      });
    }
    if (btnHostNext) {
      btnHostNext.addEventListener('click', () => {
        currentSlide++;
        updateHostDisplay();
        sendPeerMessage({ type: 'sync_state', slide: currentSlide });
        sendToNativeServer({ type: 'command', action: 'next' });
      });
    }

    // Initial
    renderTimerUI();
    const isStatic = checkIsStaticHost();
    const cfg = getTargetServerConfig();
    if (!isStatic || cfg.hasCustomServer) {
      loadServerInfo();
      const infoInterval = setInterval(async () => {
        await loadServerInfo();
        if (serverInfo && serverInfo.hasTunnel) clearInterval(infoInterval);
      }, 2000);
      connectWebSocket();
    }
    connectNativeServer();
    initWebRTCPeer();
    requestWakeLock();
  </script>
</body>
</html>
