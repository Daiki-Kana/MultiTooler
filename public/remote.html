<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Slide Controller</title>
  <link rel="stylesheet" href="style.css">
  <script src="jsqr.min.js"></script>
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      background-color: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.012em;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    /* スリープ防止ビデオを画面外に完全に除外し、レイアウト押し下げを防止 */
    #fallbackVideo {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -100;
    }

    .view-container {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    .view-container.active {
      display: flex;
    }

    /* --------------------------------------------------------------------------
       Top Bar (Icon Buttons, Zero Borders)
       -------------------------------------------------------------------------- */
    .bar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .bar-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Circular / Square Borderless Icon Buttons */
    .btn-icon {
      width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 50%;
      transition: background-color 0.12s ease, transform 0.08s ease;
      padding: 0;
      flex-shrink: 0;
    }

    .btn-icon:hover {
      background: var(--color-surface-1);
    }

    .btn-icon:active {
      background: var(--color-surface-2);
      transform: scale(0.92);
    }

    .slide-badge {
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 14px;
      color: var(--color-ink-muted);
      letter-spacing: -0.5px;
      padding: 0 4px;
    }

    /* --------------------------------------------------------------------------
       Menu View (2x2 Grid, Full Height & Width, Borderless)
       -------------------------------------------------------------------------- */
    .menu-body {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      padding: 12px 16px max(20px, env(safe-area-inset-bottom, 20px)) 16px;
      gap: 12px;
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
    }

    .menu-card {
      width: 100%;
      height: 100%;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      cursor: pointer;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: background-color 0.15s ease, transform 0.08s ease;
      font-family: var(--font-family);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .menu-card:hover {
      background: var(--color-surface-2);
    }

    .menu-card:active {
      transform: scale(0.98);
      background: #d4d4d4;
    }

    .menu-card.primary {
      background: var(--color-ink);
      color: #ffffff;
    }

    .menu-card.primary:hover {
      background: #2a2a2a;
    }

    .menu-card.primary:active {
      background: #000000;
    }

    /* --------------------------------------------------------------------------
       Remote View (Icon Centric, Borderless)
       -------------------------------------------------------------------------- */
    .button-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 10px max(16px, env(safe-area-inset-bottom, 16px)) 10px;
      min-height: 0;
      box-sizing: border-box;
    }

    /* 上段: PREV (前のスライドへ戻る) */
    .btn-remote-prev {
      flex: 4;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .btn-remote-prev:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-prev:active, .btn-remote-prev.pressed {
      background-color: #d8d8d8;
      transform: scale(0.98);
    }

    /* 中段: 細めのタイマー停止・再開ボタン (誤タップ防止でスリムに配置) */
    .btn-remote-timer {
      flex: 2;
      min-height: 56px;
      max-height: 68px;
      background-color: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      touch-action: manipulation;
      transition: background-color 0.15s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn-remote-timer:hover {
      background-color: var(--color-surface-2);
    }

    .btn-remote-timer:active, .btn-remote-timer.pressed {
      transform: scale(0.97);
    }

    /* タイマー進行中 */
    .btn-remote-timer.timer-running {
      background-color: var(--color-surface-2);
      color: var(--color-ink);
    }

    /* タイマー停止中 */
    .btn-remote-timer.timer-paused {
      background-color: var(--color-surface-1);
      color: var(--color-ink-muted);
    }

    .timer-display-wrap {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .timer-text {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .timer-state-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-surface-1);
      color: var(--color-ink);
      transition: all 0.12s ease;
    }

    .timer-running .timer-state-icon {
      background: var(--color-ink);
      color: #ffffff;
    }

    .timer-paused .icon-play { display: block; margin-left: 2px; }
    .timer-paused .icon-pause { display: none; }
    .timer-running .icon-play { display: none; }
    .timer-running .icon-pause { display: block; }

    /* 下段: 今まで通りのNEXTボタン (スライド送りのメイン領域) */
    .btn-remote-next {
      flex: 6;
      background-color: var(--color-ink);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 16px;
      touch-action: manipulation;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .btn-remote-next:hover {
      background-color: #2a2a2a;
    }

    .btn-remote-next:active, .btn-remote-next.pressed {
      background-color: #000000;
      transform: scale(0.98);
    }

    /* --------------------------------------------------------------------------
       Modal (Icon Focused, Soft Elevation, No Box Borders)
       -------------------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-panel {
      background: var(--color-canvas);
      border: none;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 360px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border-radius: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .tab-bar {
      display: flex;
      background: var(--color-surface-1);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .tab-item {
      flex: 1;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--color-ink-muted);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.12s ease;
    }

    .tab-item.active {
      background: #ffffff;
      color: var(--color-ink);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 0 12px;
    }

    .qr-img {
      display: block;
      width: 200px;
      height: 200px;
      background: #ffffff;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .url-row {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--color-surface-1);
      border-radius: 8px;
      padding: 4px 4px 4px 12px;
    }

    .url-text {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pin-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--color-surface-1);
      border-radius: 8px;
      padding: 6px 6px 6px 14px;
      margin-top: 10px;
      box-sizing: border-box;
    }

    .pin-display {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pin-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--color-ink-muted);
      text-transform: uppercase;
    }

    .pin-value {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--color-ink);
    }

    /* --------------------------------------------------------------------------
       PIN Authentication Modal (Phone Lock Screen, Borderless, Icon First)
       -------------------------------------------------------------------------- */
    .pin-auth-panel {
      max-width: 310px;
      padding: 32px 24px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--color-canvas);
      border-radius: 24px;
      border: none;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.16);
    }

    .pin-auth-head {
      margin-bottom: 24px;
      color: var(--color-ink);
    }

    .pin-indicator-row {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      align-items: center;
      justify-content: center;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-surface-2);
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .pin-dot.filled {
      background: var(--color-ink);
      transform: scale(1.1);
    }

    .pin-indicator-row.shake {
      animation: pinShake 0.4s ease-in-out;
    }

    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 18px;
      width: 100%;
      max-width: 250px;
      justify-items: center;
    }

    .pin-key {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-family);
      font-size: 24px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background-color 0.1s ease, transform 0.08s ease;
    }

    .pin-key:hover {
      background: var(--color-surface-2);
    }

    .pin-key:active {
      transform: scale(0.92);
      background: #d4d4d4;
    }

    .pin-key-dummy {
      width: 62px;
      height: 62px;
    }

    .pin-key-back {
      background: transparent;
    }

    .pin-key-back:hover {
      background: var(--color-surface-1);
    }

    .pin-key-back:active {
      background: var(--color-surface-2);
    }

    /* Camera Scanner Viewport */
    .scanner-viewport {
      position: relative;
      width: 100%;
      height: 280px;
      background: #111111;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scanVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scanner-reticle {
      position: absolute;
      width: 180px;
      height: 180px;
      pointer-events: none;
    }

    .scanner-reticle .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #ffffff;
      border-style: solid;
      border-width: 0;
    }

    .scanner-reticle .corner.tl {
      top: 0; left: 0;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 6px;
    }

    .scanner-reticle .corner.tr {
      top: 0; right: 0;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 6px;
    }

    .scanner-reticle .corner.bl {
      bottom: 0; left: 0;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 6px;
    }

    .scanner-reticle .corner.br {
      bottom: 0; right: 0;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 6px;
    }

    /* Settings in Modal */
    .time-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .time-input {
      flex: 1;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 500;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      outline: none;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .preset-btn {
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      font-family: var(--font-family);
      font-size: 13px;
      font-weight: 500;
      padding: 12px 4px;
      cursor: pointer;
      text-align: center;
      border-radius: 8px;
      transition: background-color 0.1s ease;
    }

    .preset-btn:hover {
      background: var(--color-surface-2);
    }

    .preset-btn.selected {
      background: var(--color-ink);
      color: #ffffff;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      font-size: 13px;
      color: var(--color-ink);
      margin-bottom: 20px;
      border-top: 1px solid var(--color-surface-1);
      border-bottom: 1px solid var(--color-surface-1);
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flash-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: rgba(15, 98, 254, 0);
      transition: background 0.08s ease-out;
      z-index: 200;
    }

    .flash-overlay.active {
      background: rgba(15, 98, 254, 0.08);
    }

    /* --------------------------------------------------------------------------
       Joystick View (Portrait, Borderless, Joycon-Style)
       -------------------------------------------------------------------------- */
    #viewTrackpad {
      display: none;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      flex-direction: column;
      background: var(--color-canvas);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewTrackpad.active {
      display: flex;
    }

    .stick-main-container {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 6px 16px max(16px, env(safe-area-inset-bottom, 16px)) 16px;
      box-sizing: border-box;
      touch-action: none;
      overflow: hidden;
    }

    /* 上部アクション行 */
    .stick-action-row {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .stick-action-btn {
      flex: 1;
      height: 52px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.1s ease, transform 0.08s ease;
      touch-action: manipulation;
    }

    .stick-action-btn:hover {
      background: var(--color-surface-2);
    }

    .stick-action-btn:active, .stick-action-btn.active {
      background: var(--color-ink);
      color: #ffffff;
      transform: scale(0.94);
    }

    /* キーボード入力トレイ (1行ミニマル・ボーダーレス・アイコンファースト) */
    .keyboard-tray {
      display: none;
      width: 100%;
      max-width: 400px;
      margin-top: 8px;
      transition: all 0.2s ease;
    }

    .keyboard-tray.active {
      display: flex;
    }

    .keyboard-input-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phone-input {
      flex: 1;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 0 14px;
      font-family: var(--font-family);
      font-size: 15px;
      color: var(--color-ink);
      box-sizing: border-box;
      transition: background-color 0.12s ease;
    }

    .phone-input:focus {
      background: var(--color-surface-2);
    }

    .key-sub-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-surface-1);
      color: var(--color-ink);
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-sub-btn:hover {
      background: var(--color-surface-2);
    }

    .key-sub-btn:active {
      transform: scale(0.92);
      background: #d4d4d4;
    }

    .key-send-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--color-ink);
      color: #ffffff;
      flex-shrink: 0;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.12s ease, transform 0.08s ease;
    }

    .key-send-btn:hover {
      background: #2a2a2a;
    }

    .key-send-btn:active {
      transform: scale(0.92);
      background: #000000;
    }

    /* トラックパッド領域 (広大・高精度・ボーダーレス) */
    .trackpad-wrapper {
      flex: 1;
      width: 100%;
      max-width: 360px;
      margin: 8px 0;
      min-height: 120px;
      display: flex;
      align-items: stretch;
      touch-action: none;
    }

    .trackpad-surface {
      flex: 1;
      width: 100%;
      background: var(--color-surface-1);
      border: none;
      border-radius: 20px;
      position: relative;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease;
      cursor: default;
    }

    .trackpad-surface:active, .trackpad-surface.touching {
      background: var(--color-surface-2);
    }

    /* 下部コントロール群 (ドラッグ長押しバー ＋ コピー/ペースト) */
    .stick-bottom-controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .stick-drag-row {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* 長押しバー (丸アイコン全廃・ボーダーレス・ミニマルバー) */
    .stick-drag-btn {
      width: 100%;
      height: 44px;
      background: var(--color-surface-1);
      border: none;
      color: var(--color-ink);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      position: relative;
      transition: background-color 0.12s ease, transform 0.08s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    /* バー中央のミニマルなインジケーター線 */
    .stick-drag-btn::after {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-ink);
      opacity: 0.25;
      transition: all 0.12s ease;
    }

    .stick-drag-btn:hover {
      background: var(--color-surface-2);
    }

    /* 長押し押下中の状態 (ネオンレッド反転・高コントラスト) */
    .stick-drag-btn.holding {
      background: #ff003b;
      transform: scale(0.98);

  <!-- 7. PIN Authentication Modal (Borderless, Minimal Keypad) -->
  <div id="pinAuthModal" class="modal-backdrop">

            <line x1="18" y1="9" x2="12" y2="15"></line>

  <script>
    // --------------------------------------------------------------------------
    // View Switcher
    // --------------------------------------------------------------------------
    function switchView(viewId) {
      document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
        window.scrollTo(0, 0);
      }
    }

    const cardSlideSwitch = document.getElementById('cardSlideSwitch');
    const cardTrackpad = document.getElementById('cardTrackpad');
    const btnBackToMenu = document.getElementById('btnBackToMenu');

    if (cardSlideSwitch) cardSlideSwitch.addEventListener('click', () => switchView('viewSlideSwitch'));
    if (cardTrackpad) cardTrackpad.addEventListener('click', () => switchView('viewTrackpad'));
    if (btnBackToMenu) btnBackToMenu.addEventListener('click', () => {
      pauseTimer();
      switchView('viewToolMenu');
    });

    // --------------------------------------------------------------------------
    // Joystick Mouse Control (Portrait, Joycon-Style) & Actions
    // --------------------------------------------------------------------------
    const btnTrackpadBack = document.getElementById('btnTrackpadBack');
    const btnStickSettings = document.getElementById('btnStickSettings');
    const btnSideCopy = document.getElementById('btnSideCopy');
    const btnSidePaste = document.getElementById('btnSidePaste');
    const btnStickDragHold = document.getElementById('btnStickDragHold');

    const inputSensitivity = document.getElementById('inputSensitivity');
    const sensitivityText = document.getElementById('sensitivityText');

    let currentSensitivity = parseInt(localStorage.getItem('mouseSensitivity'), 10) || 5;
    if (inputSensitivity && sensitivityText) {
      inputSensitivity.value = currentSensitivity;
      sensitivityText.textContent = currentSensitivity;

      inputSensitivity.addEventListener('input', () => {
        currentSensitivity = parseInt(inputSensitivity.value, 10) || 5;
        sensitivityText.textContent = currentSensitivity;
        localStorage.setItem('mouseSensitivity', currentSensitivity);
      });
    }

    function sendWsPayload(payload) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      }
    }

    if (btnTrackpadBack) {
      btnTrackpadBack.addEventListener('click', () => switchView('viewToolMenu'));
    }



    // クリップボード: コピー
    if (btnSideCopy) {
      btnSideCopy.addEventListener('click', () => {
        sendWsPayload({ type: 'clipboard', action: 'copy' });
        if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
        btnSideCopy.classList.add('active');
        setTimeout(() => btnSideCopy.classList.remove('active'), 180);
      });
    }

    // クリップボード: ペースト
    if (btnSidePaste) {
      btnSidePaste.addEventListener('click', () => {
        sendWsPayload({ type: 'clipboard', action: 'paste' });
        if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
        btnSidePaste.classList.add('active');
        setTimeout(() => btnSidePaste.classList.remove('active'), 180);
      });
    }

    // --------------------------------------------------------------------------
    // 遠隔キーボード制御ロジック
    // --------------------------------------------------------------------------
    const btnToggleKeyboard = document.getElementById('btnToggleKeyboard');
    const keyboardTray = document.getElementById('keyboardTray');
    const phoneTextInput = document.getElementById('phoneTextInput');
    const btnSendText = document.getElementById('btnSendText');
    const btnKeyBackspace = document.getElementById('btnKeyBackspace');

    function sendPhoneText() {
      if (!phoneTextInput) return;
      const text = phoneTextInput.value;
      if (text.length > 0) {
        sendWsPayload({ type: 'keyboard_text', text });
        phoneTextInput.value = '';
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}
      }
    }

    if (btnToggleKeyboard && keyboardTray) {
      btnToggleKeyboard.addEventListener('click', () => {
        const isOpening = !keyboardTray.classList.contains('active');
        keyboardTray.classList.toggle('active');
        btnToggleKeyboard.classList.toggle('active', isOpening);
        if (isOpening && phoneTextInput) {
          setTimeout(() => phoneTextInput.focus(), 100);
        }
      });
    }

    // テキスト確定キー（入力内容をPCへ注入）
    if (btnSendText) {
      btnSendText.addEventListener('click', sendPhoneText);
    }

    if (phoneTextInput) {
      phoneTextInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          if (e.isComposing) return; // 日本語IME変換確定時は送信しない
          e.preventDefault();
          sendPhoneText();
          setTimeout(() => phoneTextInput.focus(), 50);
        }
      });
    }

    // 一文字削除ボタン（PCのアクティブな入力欄から1文字消す ＋ スマホ入力中の文字も1文字消す）
    if (btnKeyBackspace) {
      btnKeyBackspace.addEventListener('click', () => {
        sendWsPayload({ type: 'keyboard_key', key: 'BACKSPACE' });
        if (phoneTextInput && phoneTextInput.value.length > 0) {
          phoneTextInput.value = phoneTextInput.value.slice(0, -1);
        }
        if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
      });
    }

    // ドラッグボタン: 「長押し（ホールド）」実装
    // 押している間だけドラッグ状態になり、指を離すと即座に解除
    let isHoldingDrag = false;

    function startDragHold(e) {
      if (e) e.preventDefault();
      if (isHoldingDrag) return;
      isHoldingDrag = true;
      if (btnStickDragHold) btnStickDragHold.classList.add('holding');
      sendWsPayload({ type: 'mouse_drag', state: 'start' });
      if (navigator.vibrate) try { navigator.vibrate(35); } catch (err) {}
    }

    function stopDragHold(e) {
      if (e && e.cancelable) e.preventDefault();
      if (!isHoldingDrag) return;
      isHoldingDrag = false;
      if (btnStickDragHold) btnStickDragHold.classList.remove('holding');
      sendWsPayload({ type: 'mouse_drag', state: 'end' });
      if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
    }

    if (btnStickDragHold) {
      // touchイベントで確実に補足（pointercaptureによるマルチタッチ阻害を回避）
      btnStickDragHold.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDragHold(e);
      }, { passive: false });
      btnStickDragHold.addEventListener('touchend', (e) => {
        e.preventDefault();
        stopDragHold(e);
      }, { passive: false });
      btnStickDragHold.addEventListener('touchcancel', (e) => {
        stopDragHold(e);
      }, { passive: false });

      // PCマウス操作時用のフォールバック
      btnStickDragHold.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startDragHold(e);
      });
      window.addEventListener('mouseup', () => {
        if (isHoldingDrag) stopDragHold();
      });
      btnStickDragHold.addEventListener('contextmenu', (e) => e.preventDefault());
    }

    // セーフティ: ウィンドウが非アクティブ化されたら確実にドラッグ解除
    window.addEventListener('blur', () => {
      if (isHoldingDrag) stopDragHold();
    });

    // --------------------------------------------------------------------------
    // 高精度・超滑らかトラックパッド制御ロジック (EMA平滑化 ＋ 非線形加速 ＋ RAF同期)
    // --------------------------------------------------------------------------
    const trackpadSurface = document.getElementById('trackpadSurface');

    // 高精度サブピクセル・アキュムレータ (端数を完全保持してカクつきを完全排除)
    let touchTracking = new Map(); // touchId -> { curX, curY, startX, startY, startTime }
    let accumX = 0;
    let accumY = 0;
    let accumScroll = 0;

    // 二本指タップ判定用 (二本指タップで右クリック)
    let twoFingerStartTime = 0;
    let twoFingerCandidate = false;
    let lastTwoFingerTapTime = 0;

    // トラックパッド直接長押しドラッグ用タイマー
    let directDragTimer = null;
    let isDirectDragging = false;

    // アニメーションフレーム同期ループ (ディスプレイ更新周期に合わせて一定間隔で滑らかに送信)
    function trackpadSyncLoop() {
      // 整数ピクセル分を取り出して送信
      const moveX = Math.trunc(accumX);
      const moveY = Math.trunc(accumY);

      if (moveX !== 0 || moveY !== 0) {
        sendWsPayload({ type: 'mouse_move', dx: moveX, dy: moveY });
        // 送信した整数分のみを引き、1px未満の端数は次フレームへ完全に保持！
        accumX -= moveX;
        accumY -= moveY;
      }

      // 2本指スクロール
      const scrollY = Math.trunc(accumScroll);
      if (scrollY !== 0) {
        sendWsPayload({ type: 'mouse_scroll', delta: scrollY });
        accumScroll -= scrollY;
      }

      requestAnimationFrame(trackpadSyncLoop);
    }
    requestAnimationFrame(trackpadSyncLoop);

    if (trackpadSurface) {
      trackpadSurface.addEventListener('touchstart', (e) => {
        e.preventDefault();
        trackpadSurface.classList.add('touching');

        const touches = e.targetTouches;

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          touchTracking.set(t.identifier, {
            curX: t.clientX,
            curY: t.clientY,
            startX: t.clientX,
            startY: t.clientY,
            startTime: Date.now()
          });
        }

        // 2本指タップ候補の検出
        if (touches.length === 2) {
          twoFingerStartTime = Date.now();
          twoFingerCandidate = true;
          if (directDragTimer) { clearTimeout(directDragTimer); directDragTimer = null; }
        } else if (touches.length === 1 && !isHoldingDrag) {
          twoFingerCandidate = false;
          // トラックパッド直接長押し判定: 380ms 静止でドラッグ開始
          const t = touches[0];
          directDragTimer = setTimeout(() => {
            if (touchTracking.has(t.identifier) && e.targetTouches.length === 1) {
              const info = touchTracking.get(t.identifier);
              const dist = Math.hypot(info.curX - info.startX, info.curY - info.startY);
              if (dist < 10 && !isHoldingDrag && !isDirectDragging) {
                isDirectDragging = true;
                sendWsPayload({ type: 'mouse_drag', state: 'start' });
                if (btnStickDragHold) btnStickDragHold.classList.add('holding');
                if (navigator.vibrate) try { navigator.vibrate(40); } catch (err) {}
              }
            }
          }, 380);
        } else {
          twoFingerCandidate = false;
          if (directDragTimer) { clearTimeout(directDragTimer); directDragTimer = null; }
        }
      }, { passive: false });

      trackpadSurface.addEventListener('touchmove', (e) => {
        e.preventDefault();
        // ★重要: e.touches(全体) ではなく e.targetTouches(トラックパッド上のみ) を参照
        const touches = e.targetTouches;

        if (touches.length === 1) {
          // 1本指: カーソル移動
          const t = touches[0];
          const prev = touchTracking.get(t.identifier);
          if (prev) {
            const rawDx = t.clientX - prev.curX;
            const rawDy = t.clientY - prev.curY;
            prev.curX = t.clientX;
            prev.curY = t.clientY;

            const totalMoved = Math.hypot(t.clientX - prev.startX, t.clientY - prev.startY);
            if (totalMoved > 10 && directDragTimer && !isDirectDragging) {
              clearTimeout(directDragTimer);
              directDragTimer = null;
            }

            const dist = Math.hypot(rawDx, rawDy);
            if (dist > 0) {
              const sens = 0.7 + (currentSensitivity * 0.13);
              const accel = dist < 2.5 ? 1.0 : Math.min(2.5, 1.0 + (dist - 2.5) * 0.1);

              accumX += rawDx * sens * accel;
              accumY += rawDy * sens * accel;
            }
          }
        } else if (touches.length === 2) {
          // 2本指: スクロール
          if (directDragTimer) { clearTimeout(directDragTimer); directDragTimer = null; }

          const t0 = touches[0];
          const t1 = touches[1];
          const prev0 = touchTracking.get(t0.identifier);
          const prev1 = touchTracking.get(t1.identifier);
          if (prev0 && prev1) {
            const dy0 = t0.clientY - prev0.curY;
            const dy1 = t1.clientY - prev1.curY;
            prev0.curX = t0.clientX;
            prev0.curY = t0.clientY;
            prev1.curX = t1.clientX;
            prev1.curY = t1.clientY;

            // 移動量が大きければ2本指タップ候補をキャンセル
            const move0 = Math.hypot(t0.clientX - prev0.startX, t0.clientY - prev0.startY);
            const move1 = Math.hypot(t1.clientX - prev1.startX, t1.clientY - prev1.startY);
            if (move0 > 8 || move1 > 8) {
              twoFingerCandidate = false;
            }

            // ★ スクロール上下反転 (-=)
            accumScroll -= ((dy0 + dy1) / 2) * 1.6;
          }
        }
      }, { passive: false });

      const handleTouchEnd = (e) => {
        const now = Date.now();
        if (directDragTimer) {
          clearTimeout(directDragTimer);
          directDragTimer = null;
        }

        // 直接長押しドラッグ中だった場合は終了
        if (isDirectDragging) {
          isDirectDragging = false;
          if (!isHoldingDrag) {
            sendWsPayload({ type: 'mouse_drag', state: 'end' });
            if (btnStickDragHold) btnStickDragHold.classList.remove('holding');
            if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
          }
        }

        // 2本指タップ判定: 300ms未満 & 候補フラグ有効 → 右クリック
        if (twoFingerCandidate && (now - twoFingerStartTime < 300) && e.targetTouches.length === 0) {
          twoFingerCandidate = false;
          lastTwoFingerTapTime = now;
          sendWsPayload({ type: 'mouse_click', button: 'right' });
          if (navigator.vibrate) try { navigator.vibrate(25); } catch (err) {}
        }

        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          const track = touchTracking.get(t.identifier);
          if (track) {
            const dist = Math.hypot(t.clientX - track.startX, t.clientY - track.startY);
            const duration = now - track.startTime;

            // 1本指タップ判定: 280ms未満 & 移動7px以内 & 2本指タップ直後でない & ドラッグ中でない → 左クリック
            if (e.targetTouches.length === 0 && duration < 280 && dist < 7 &&
                (now - lastTwoFingerTapTime > 350) && !isHoldingDrag && !isDirectDragging) {
              sendWsPayload({ type: 'mouse_click', button: 'left' });
              if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
            }
            touchTracking.delete(t.identifier);
          }
        }

        if (e.targetTouches.length === 0) {
          trackpadSurface.classList.remove('touching');
          accumX = 0;
          accumY = 0;
          accumScroll = 0;
          twoFingerCandidate = false;
        }
      };

      trackpadSurface.addEventListener('touchend', handleTouchEnd, { passive: false });
      trackpadSurface.addEventListener('touchcancel', handleTouchEnd, { passive: false });
    }

    // --------------------------------------------------------------------------
    // Connect QR Modal
    // --------------------------------------------------------------------------
    const connectModal = document.getElementById('connectModal');
    const btnMenuConnect = document.getElementById('btnMenuConnect');
    const cardConnectQr = document.getElementById('cardConnectQr');
    const btnRemoteQr = document.getElementById('btnRemoteQr');
    const connectCloseX = document.getElementById('connectCloseX');

    function openConnectModal() { connectModal.classList.add('active'); }
    function closeConnectModal() { connectModal.classList.remove('active'); }

    if (btnMenuConnect) btnMenuConnect.addEventListener('click', openConnectModal);
    if (cardConnectQr) cardConnectQr.addEventListener('click', openConnectModal);
    if (btnRemoteQr) btnRemoteQr.addEventListener('click', openConnectModal);
    if (connectCloseX) connectCloseX.addEventListener('click', closeConnectModal);

    connectModal.addEventListener('click', (e) => {
      if (e.target === connectModal) closeConnectModal();
    });

    // --------------------------------------------------------------------------
    // Camera Scanner Modal (QR Reader) - jsQR & BarcodeDetector 双方対応
    // --------------------------------------------------------------------------
    const cameraModal = document.getElementById('cameraModal');
    const cardScanCamera = document.getElementById('cardScanCamera');
    const btnMenuScan = document.getElementById('btnMenuScan');
    const cameraCloseX = document.getElementById('cameraCloseX');
    const scanVideo = document.getElementById('scanVideo');
    const scanError = document.getElementById('scanError');

    let cameraStream = null;
    let scanAnimationId = null;
    let scanCanvas = null;
    let scanCtx = null;

    let barcodeDetector = null;
    if ('BarcodeDetector' in window) {
      try {
        barcodeDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {}
    }

    async function openCameraScanner() {
      cameraModal.classList.add('active');
      if (scanError) {
        scanError.style.display = 'none';
        scanError.textContent = '';
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showScanError('Camera not supported on this browser');
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        scanVideo.srcObject = cameraStream;
        scanVideo.setAttribute('playsinline', 'true'); // iOS Safari対策
        await scanVideo.play();
        startScanLoop();
      } catch (err) {
        console.error('Camera access error:', err);
        showScanError('Camera permission required or device unavailable');
      }
    }

    function showScanError(msg) {
      if (scanError) {
        scanError.textContent = msg;
        scanError.style.display = 'block';
      }
    }

    function closeCameraScanner() {
      cameraModal.classList.remove('active');
      stopScanLoop();
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      if (scanVideo) scanVideo.srcObject = null;
    }

    function startScanLoop() {
      if (!scanCanvas) {
        scanCanvas = document.createElement('canvas');
        scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
      }

      const scanStep = async () => {
        if (!cameraStream || scanVideo.readyState < 2) {
          scanAnimationId = requestAnimationFrame(scanStep);
          return;
        }

        const width = scanVideo.videoWidth;
        const height = scanVideo.videoHeight;
        if (width === 0 || height === 0) {
          scanAnimationId = requestAnimationFrame(scanStep);
          return;
        }

        let detectedUrl = null;

        // 1. 高速なNative BarcodeDetector（Android Chrome等）
        if (barcodeDetector) {
          try {
            const barcodes = await barcodeDetector.detect(scanVideo);
            if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
              detectedUrl = barcodes[0].rawValue.trim();
            }
          } catch (e) {}
        }

        // 2. jsQRフォールバック（iOS Safari全バージョン対応）
        if (!detectedUrl && window.jsQR) {
          try {
            scanCanvas.width = width;
            scanCanvas.height = height;
            scanCtx.drawImage(scanVideo, 0, 0, width, height);
            const imageData = scanCtx.getImageData(0, 0, width, height);
            const qrCode = window.jsQR(imageData.data, imageData.width, imageData.height, {
              inversionAttempts: 'dontInvert'
            });
            if (qrCode && qrCode.data) {
              detectedUrl = qrCode.data.trim();
            }
          } catch (e) {}
        }

        if (detectedUrl && (detectedUrl.startsWith('http://') || detectedUrl.startsWith('https://'))) {
          if (navigator.vibrate) {
            try { navigator.vibrate(100); } catch (e) {}
          }
          closeCameraScanner();
          window.location.href = detectedUrl;
          return;
        }

        scanAnimationId = requestAnimationFrame(scanStep);
      };

      scanAnimationId = requestAnimationFrame(scanStep);
    }

    function stopScanLoop() {
      if (scanAnimationId) {
        cancelAnimationFrame(scanAnimationId);
        scanAnimationId = null;
      }
    }

    if (cardScanCamera) cardScanCamera.addEventListener('click', openCameraScanner);
    if (btnMenuScan) btnMenuScan.addEventListener('click', openCameraScanner);
    if (cameraCloseX) cameraCloseX.addEventListener('click', closeCameraScanner);

    cameraModal.addEventListener('click', (e) => {
      if (e.target === cameraModal) closeCameraScanner();
    });

    // --------------------------------------------------------------------------
    // Server Info & QR
    // --------------------------------------------------------------------------
    let serverInfo = null;
    let activeQrTab = 'tunnel';

    const tabTunnel = document.getElementById('tabTunnel');
    const tabLocal = document.getElementById('tabLocal');
    const qrImage = document.getElementById('qrImage');
    const remoteUrlDisplay = document.getElementById('remoteUrlDisplay');
    const copyUrlBtn = document.getElementById('copyUrlBtn');
    const pinDisplayCode = document.getElementById('pinDisplayCode');
    const btnRegeneratePin = document.getElementById('btnRegeneratePin');

    async function loadServerInfo() {
      try {
        const res = await fetch('/api/info');
        serverInfo = await res.json();
        updateQrDisplay();
        if (pinDisplayCode && serverInfo.pin) {
          pinDisplayCode.textContent = serverInfo.pin;
        }
      } catch (err) {}
    }

    if (btnRegeneratePin) {
      btnRegeneratePin.addEventListener('click', async () => {
        try {
          const res = await fetch('/api/regenerate-pin', { method: 'POST' });
          const data = await res.json();
          if (data.pin && pinDisplayCode) {
            pinDisplayCode.textContent = data.pin;
            if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
          }
        } catch (e) {}
      });
    }

    function updateQrDisplay() {
      if (!serverInfo) return;
      if (activeQrTab === 'tunnel' && serverInfo.hasTunnel) {
        qrImage.src = serverInfo.tunnelQrDataUrl;
        remoteUrlDisplay.textContent = serverInfo.tunnelRemoteUrl;
      } else {
        qrImage.src = serverInfo.localQrDataUrl;
        remoteUrlDisplay.textContent = serverInfo.localRemoteUrl;
      }
    }

    tabTunnel.addEventListener('click', () => {
      activeQrTab = 'tunnel';
      tabTunnel.classList.add('active');
      tabLocal.classList.remove('active');
      updateQrDisplay();
    });

    tabLocal.addEventListener('click', () => {
      activeQrTab = 'local';
      tabLocal.classList.add('active');
      tabTunnel.classList.remove('active');
      updateQrDisplay();
    });

    copyUrlBtn.addEventListener('click', () => {
      const url = remoteUrlDisplay.textContent;
      if (!url) return;
      navigator.clipboard.writeText(url).then(() => {
        copyUrlBtn.style.color = 'var(--color-semantic-success)';
        setTimeout(() => { copyUrlBtn.style.color = ''; }, 1500);
      });
    });

    // --------------------------------------------------------------------------
    // PIN Authentication Logic (テンキー & 4桁認証)
    // --------------------------------------------------------------------------
    const pinAuthModal = document.getElementById('pinAuthModal');
    const pinSlots = document.getElementById('pinSlots');
    const pinKeypad = document.getElementById('pinKeypad');
    const btnPinDelete = document.getElementById('btnPinDelete');

    let enteredPin = '';
    let isAuthenticated = false;

    function openPinModal() {
      if (isAuthenticated) return;
      if (pinAuthModal) pinAuthModal.classList.add('active');
    }

    function closePinModal() {
      isAuthenticated = true;
      if (pinAuthModal) pinAuthModal.classList.remove('active');
    }

    function updatePinDots() {
      if (!pinSlots) return;
      const dots = pinSlots.querySelectorAll('.pin-dot');
      dots.forEach((dot, idx) => {
        if (idx < enteredPin.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function triggerPinShake() {
      if (!pinSlots) return;
      pinSlots.classList.add('shake');
      if (navigator.vibrate) try { navigator.vibrate([40, 60, 40]); } catch (e) {}
      setTimeout(() => {
        pinSlots.classList.remove('shake');
        enteredPin = '';
        updatePinDots();
      }, 400);
    }

    if (pinKeypad) {
      pinKeypad.querySelectorAll('.pin-key[data-digit]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (enteredPin.length < 4) {
            enteredPin += btn.getAttribute('data-digit');
            updatePinDots();
            if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
            if (enteredPin.length === 4) {
              sendWsPayload({ type: 'auth', pin: enteredPin });
              localStorage.setItem('wss_pin', enteredPin);
            }
          }
        });
      });
    }

    if (btnPinDelete) {
      btnPinDelete.addEventListener('click', () => {
        if (enteredPin.length > 0) {
          enteredPin = enteredPin.slice(0, -1);
          updatePinDots();
          if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
        }
      });
    }

    // --------------------------------------------------------------------------
    // WebSocket 接続
    // --------------------------------------------------------------------------
    let socket = null;
    const menuWsDot = document.getElementById('menuWsDot');
    const remoteWsDot = document.getElementById('remoteWsDot');

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${window.location.host}`);

      socket.addEventListener('open', () => {
        updateWsIndicator(true);
        const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const urlParams = new URLSearchParams(window.location.search);
        const urlPin = urlParams.get('pin');
        const savedPin = urlPin || localStorage.getItem('wss_pin') || '';
        if (urlPin) localStorage.setItem('wss_pin', urlPin);

        socket.send(JSON.stringify({
          type: 'register',
          clientType: isLocalHost ? 'pc' : 'mobile',
          pin: savedPin
        }));
        requestWakeLock();
      });

      socket.addEventListener('message', (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'auth_required' || msg.type === 'auth_fail') {
            isAuthenticated = false;
            openPinModal();
            if (msg.type === 'auth_fail') {
              localStorage.removeItem('wss_pin');
              triggerPinShake();
            }
          } else if (msg.type === 'auth_success') {
            closePinModal();
          }
        } catch (e) {}
      });

      socket.addEventListener('close', () => {
        updateWsIndicator(false);
        setTimeout(connectWebSocket, 2000);
      });

      socket.addEventListener('error', () => {});
    }

    function updateWsIndicator(isConnected) {
      const dotClass = isConnected ? 'status-dot active' : 'status-dot warning';
      if (menuWsDot) menuWsDot.className = dotClass;
      if (remoteWsDot) remoteWsDot.className = dotClass;
      const trackpadWsDot = document.getElementById('trackpadWsDot');
      if (trackpadWsDot) trackpadWsDot.className = dotClass;
    }

    // --------------------------------------------------------------------------
    // プレゼン操作 (タイマー & キー送信)
    // --------------------------------------------------------------------------
    let currentSlide = 1;
    const mainTimerText = document.getElementById('mainTimerText');
    const timerToggleBtn = document.getElementById('timerToggleBtn');
    const btnResetTimerDirect = document.getElementById('btnResetTimerDirect');
    const flashOverlay = document.getElementById('flashOverlay');
    const btnNext = document.getElementById('btnNext');
    const btnPrev = document.getElementById('btnPrev');

    // ストップウォッチ (デフォルト: カウントアップ方式 00:00スタート)
    let targetTotalSeconds = 0;
    let remainingSeconds = 0;
    let elapsedSeconds = 0;
    let timerInterval = null;
    let isTimerRunning = false;

    function formatTimeDisplay(sec, isCountdown) {
      if (isCountdown) {
        if (sec >= 0) {
          const m = Math.floor(sec / 60);
          const s = sec % 60;
          return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        } else {
          const abs = Math.abs(sec);
          const m = Math.floor(abs / 60);
          const s = abs % 60;
          return `-${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
      } else {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      }
    }

    function renderTimerUI() {
      const isCountdown = targetTotalSeconds > 0;
      const displaySec = isCountdown ? remainingSeconds : elapsedSeconds;
      if (mainTimerText) {
        mainTimerText.textContent = formatTimeDisplay(displaySec, isCountdown);
      }

      if (timerToggleBtn) {
        if (isTimerRunning) {
          timerToggleBtn.classList.remove('timer-paused');
          timerToggleBtn.classList.add('timer-running');
        } else {
          timerToggleBtn.classList.add('timer-paused');
          timerToggleBtn.classList.remove('timer-running');
        }
      }
    }

    function startTimer() {
      if (isTimerRunning) return;
      isTimerRunning = true;
      timerInterval = setInterval(() => {
        if (targetTotalSeconds > 0) remainingSeconds--;
        else elapsedSeconds++;
        renderTimerUI();
      }, 1000);
      renderTimerUI();
    }

    function pauseTimer() {
      if (!isTimerRunning) return;
      clearInterval(timerInterval);
      isTimerRunning = false;
      renderTimerUI();
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = targetTotalSeconds;
      elapsedSeconds = 0;
      renderTimerUI();
    }

    // 中段タイマーボタン: テキスト・ボタンタップで停止/再開
    if (timerToggleBtn) {
      timerToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isTimerRunning) {
          pauseTimer();
        } else {
          startTimer();
        }
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
      });
    }

    // ヘッダータイマーリセットボタン
    if (btnResetTimerDirect) {
      btnResetTimerDirect.addEventListener('click', (e) => {
        e.stopPropagation();
        resetTimer();
        if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}
      });
    }

    let lastCommandTime = 0;
    const COMMAND_DEBOUNCE_MS = 200;

    function sendCommand(action) {
      const now = Date.now();
      if (now - lastCommandTime < COMMAND_DEBOUNCE_MS) return;
      lastCommandTime = now;

      flashOverlay.className = 'flash-overlay active';
      setTimeout(() => { flashOverlay.className = 'flash-overlay'; }, 70);

      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'command', action }));
        if (action === 'next') {
          currentSlide++;
        } else if (action === 'prev') {
          currentSlide = Math.max(1, currentSlide - 1);
        }
      }
    }

    function bindAction(el, action) {
      if (!el) return;
      el.addEventListener('pointerdown', () => {
        el.classList.add('pressed');
        sendCommand(action);
      });
      el.addEventListener('pointerup', () => el.classList.remove('pressed'));
      el.addEventListener('pointercancel', () => el.classList.remove('pressed'));
      el.addEventListener('click', () => {
        sendCommand(action);
      });
    }

    bindAction(btnNext, 'next');
    bindAction(btnPrev, 'prev');

    // Swipe Gesture
    let touchStartX = 0;
    let touchStartY = 0;
    const remoteArea = document.getElementById('remoteArea');

    remoteArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    remoteArea.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
        if (diffX < 0) {
          btnNext.classList.add('pressed');
          setTimeout(() => btnNext.classList.remove('pressed'), 150);
          sendCommand('next');
        } else {
          btnPrev.classList.add('pressed');
          setTimeout(() => btnPrev.classList.remove('pressed'), 150);
          sendCommand('prev');
        }
      }
    }, { passive: true });

    // --------------------------------------------------------------------------
    // 1. Slide Settings Modal (タイマー設定専用)
    // --------------------------------------------------------------------------
    const settingsBtn = document.getElementById('settingsBtn');
    const slideSettingsModal = document.getElementById('slideSettingsModal');
    const slideSettingsCloseX = document.getElementById('slideSettingsCloseX');
    const slideSettingsDoneBtn = document.getElementById('slideSettingsDoneBtn');
    const resetTimerBtn = document.getElementById('resetTimerBtn');
    const inputMinutes = document.getElementById('inputMinutes');
    const inputSeconds = document.getElementById('inputSeconds');
    const applyTimeBtn = document.getElementById('applyTimeBtn');
    const toggleAwakeSlide = document.getElementById('toggleAwakeSlide');
    const presetButtons = document.querySelectorAll('.preset-btn');

    function openSlideSettings() {
      if (targetTotalSeconds > 0) {
        inputMinutes.value = Math.floor(targetTotalSeconds / 60);
        inputSeconds.value = targetTotalSeconds % 60;
      } else {
        inputMinutes.value = 0;
        inputSeconds.value = 0;
      }
      if (toggleAwakeSlide) toggleAwakeSlide.checked = isAwakeEnabled;
      if (slideSettingsModal) slideSettingsModal.classList.add('active');
    }

    function closeSlideSettings() {
      if (slideSettingsModal) slideSettingsModal.classList.remove('active');
    }

    if (settingsBtn) settingsBtn.addEventListener('click', openSlideSettings);
    if (slideSettingsCloseX) slideSettingsCloseX.addEventListener('click', closeSlideSettings);
    if (slideSettingsDoneBtn) slideSettingsDoneBtn.addEventListener('click', closeSlideSettings);
    if (slideSettingsModal) {
      slideSettingsModal.addEventListener('click', (e) => {
        if (e.target === slideSettingsModal) closeSlideSettings();
      });
    }

    if (resetTimerBtn) {
      resetTimerBtn.addEventListener('click', () => {
        resetTimer();
        closeSlideSettings();
      });
    }

    if (applyTimeBtn) {
      applyTimeBtn.addEventListener('click', () => {
        const mins = parseInt(inputMinutes.value, 10) || 0;
        const secs = parseInt(inputSeconds.value, 10) || 0;
        const totalSec = mins * 60 + secs;
        if (totalSec >= 0) {
          presetButtons.forEach(b => b.classList.remove('selected'));
          targetTotalSeconds = totalSec;
          resetTimer();
          closeSlideSettings();
        }
      });
    }

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const mins = parseInt(btn.getAttribute('data-mins'), 10);
        const secs = parseInt(btn.getAttribute('data-secs'), 10);
        inputMinutes.value = mins;
        inputSeconds.value = secs;
        targetTotalSeconds = mins * 60 + secs;
        resetTimer();
      });
    });

    // --------------------------------------------------------------------------
    // 2. Trackpad Settings Modal (感度設定専用)
    // --------------------------------------------------------------------------
    const trackpadSettingsModal = document.getElementById('trackpadSettingsModal');
    const trackpadSettingsCloseX = document.getElementById('trackpadSettingsCloseX');
    const trackpadSettingsDoneBtn = document.getElementById('trackpadSettingsDoneBtn');
    const toggleAwakeTrackpad = document.getElementById('toggleAwakeTrackpad');

    function openTrackpadSettings() {
      if (inputSensitivity && sensitivityText) {
        inputSensitivity.value = currentSensitivity;
        sensitivityText.textContent = currentSensitivity;
      }
      if (toggleAwakeTrackpad) toggleAwakeTrackpad.checked = isAwakeEnabled;
      if (trackpadSettingsModal) trackpadSettingsModal.classList.add('active');
    }

    function closeTrackpadSettings() {
      if (trackpadSettingsModal) trackpadSettingsModal.classList.remove('active');
    }

    if (btnStickSettings) btnStickSettings.addEventListener('click', openTrackpadSettings);
    if (trackpadSettingsCloseX) trackpadSettingsCloseX.addEventListener('click', closeTrackpadSettings);
    if (trackpadSettingsDoneBtn) trackpadSettingsDoneBtn.addEventListener('click', closeTrackpadSettings);
    if (trackpadSettingsModal) {
      trackpadSettingsModal.addEventListener('click', (e) => {
        if (e.target === trackpadSettingsModal) closeTrackpadSettings();
      });
    }

    // --------------------------------------------------------------------------
    // Wake Lock (画面スリープ防止)
    // --------------------------------------------------------------------------
    let wakeLock = null;
    let isAwakeEnabled = true;
    const fallbackVideo = document.getElementById('fallbackVideo');

    async function requestWakeLock() {
      if (!isAwakeEnabled) return;
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        } else if (fallbackVideo) {
          try { await fallbackVideo.play(); } catch (e) {}
        }
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      if (fallbackVideo) fallbackVideo.pause();
    }

    function setAwakeEnabled(enabled) {
      isAwakeEnabled = enabled;
      if (toggleAwakeSlide) toggleAwakeSlide.checked = enabled;
      if (toggleAwakeTrackpad) toggleAwakeTrackpad.checked = enabled;
      if (isAwakeEnabled) requestWakeLock();
      else releaseWakeLock();
    }

    if (toggleAwakeSlide) {
      toggleAwakeSlide.addEventListener('change', () => {
        setAwakeEnabled(toggleAwakeSlide.checked);
      });
    }

    if (toggleAwakeTrackpad) {
      toggleAwakeTrackpad.addEventListener('change', () => {
        setAwakeEnabled(toggleAwakeTrackpad.checked);
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isAwakeEnabled) requestWakeLock();
    });

    window.addEventListener('pointerdown', () => {
      if (isAwakeEnabled && (!wakeLock || wakeLock.released)) requestWakeLock();
    }, { once: false });

    // Initial
    renderTimerUI();
    loadServerInfo();
    const infoInterval = setInterval(async () => {
      await loadServerInfo();
      if (serverInfo && serverInfo.hasTunnel) clearInterval(infoInterval);
    }, 2000);
    connectWebSocket();
    requestWakeLock();
  </script>
</body>
